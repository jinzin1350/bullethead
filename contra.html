<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Contra"/>
  <meta name="theme-color" content="#000000"/>
  <title>Contra — PlayZone</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/pz-core.js"></script>
  <script src="/pz-ui.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html{ height:-webkit-fill-available; }
    html,body{
      width:100%;height:100%;
      min-height:-webkit-fill-available;
      background:#000;
      overflow:hidden;user-select:none;touch-action:none;
    }
    #wrapper{
      position:fixed;top:0;left:0;
      width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      background:#000;
    }
    canvas{
      display:block;image-rendering:pixelated;
      image-rendering:crisp-edges;
      max-width:100%;max-height:100%;
    }

    /* ── PORTRAIT WARNING ── */
    #portrait-warn{
      display:none;position:fixed;inset:0;
      background:#000;color:#fff;
      align-items:center;justify-content:center;
      flex-direction:column;gap:20px;z-index:9999;
      text-align:center;padding:40px;
    }
    #portrait-warn .pw-phone{
      font-size:72px;
      animation:rotate-hint 1.4s ease-in-out infinite;
      display:inline-block;transform-origin:center;
    }
    @keyframes rotate-hint{
      0%{transform:rotate(0deg);}30%{transform:rotate(-90deg);}
      60%{transform:rotate(-90deg);}90%{transform:rotate(0deg);}100%{transform:rotate(0deg);}
    }
    .pw-title{font-size:24px;font-weight:900;font-family:'Arial Black',Arial,sans-serif;letter-spacing:1px;}
    .pw-sub{font-size:14px;color:#888;}
    .pw-bar{width:60px;height:4px;border-radius:2px;background:linear-gradient(90deg,#ff4444,#ff8800);margin-top:4px;}
    @media(orientation:portrait){#portrait-warn{display:flex;}}

    /* ── TOUCH CONTROLS ── */
    #controls{
      position:fixed;inset:0;pointer-events:none;
      display:none;z-index:10;
    }
    /* Joystick zone — left half */
    #joy-zone{
      position:absolute;left:0;top:0;
      width:50%;height:100%;pointer-events:auto;
    }
    #joy-base{
      position:absolute;width:110px;height:110px;
      border-radius:50%;
      background:rgba(255,68,68,0.12);
      border:2.5px solid rgba(255,68,68,0.35);
      display:none;transform:translate(-50%,-50%);
      pointer-events:none;
    }
    #joy-knob{
      position:absolute;width:48px;height:48px;
      border-radius:50%;
      background:rgba(255,68,68,0.7);
      border:2px solid #ff4444;
      box-shadow:0 0 14px #ff4444aa;
      transform:translate(-50%,-50%);
      pointer-events:none;
    }
    /* Jump button — وسط راست */
    #btn-jump{
      position:absolute;right:28px;bottom:36px;
      width:96px;height:96px;border-radius:50%;
      background:rgba(0,200,80,0.18);
      border:3px solid rgba(0,255,100,0.6);
      color:#00ff66;font-size:38px;
      display:flex;align-items:center;justify-content:center;
      pointer-events:auto;
      box-shadow:0 0 18px rgba(0,255,100,0.25);
      transition:background 0.08s,transform 0.08s;
    }
    #btn-jump.pressed{background:rgba(0,255,100,0.45);transform:scale(0.88);}
    /* Shoot button — hidden, auto-shoot active */
    #btn-shoot{ display:none; }
    /* Aim up button */
    #btn-up{
      position:absolute;right:140px;bottom:80px;
      width:70px;height:70px;border-radius:50%;
      background:rgba(255,200,0,0.15);
      border:2px solid rgba(255,200,0,0.5);
      color:#ffcc00;font-size:26px;
      display:flex;align-items:center;justify-content:center;
      pointer-events:auto;
      transition:background 0.08s,transform 0.08s;
    }
    #btn-up.pressed{background:rgba(255,200,0,0.4);transform:scale(0.88);}

    /* Auto-shoot badge */
    #autoshoot-badge{
      position:absolute;right:20px;bottom:148px;
      font-size:11px;font-weight:700;
      color:rgba(255,255,136,0.7);
      font-family:'Arial Black',Arial,sans-serif;
      letter-spacing:1px;pointer-events:none;
      text-align:center;width:96px;
    }

    /* Tutorial overlay */
    #touch-tutorial{
      position:fixed;inset:0;z-index:200;
      pointer-events:none;display:none;
      animation:tutFadeOut 0.5s ease 3.5s forwards;
    }
    @keyframes tutFadeOut{to{opacity:0;}}
    .tut-left{
      position:absolute;left:0;top:0;width:50%;height:100%;
      border:2.5px dashed rgba(255,68,68,0.4);
      border-radius:0 12px 12px 0;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:8px;
    }
    .tut-right{
      position:absolute;right:0;top:0;width:50%;height:100%;
      display:flex;align-items:flex-end;justify-content:center;
      padding-bottom:55px;flex-direction:column;align-items:center;
    }
    .tut-icon{font-size:36px;}
    .tut-label{font-size:13px;font-weight:900;color:rgba(255,100,100,0.85);font-family:'Arial Black',Arial,sans-serif;letter-spacing:1px;}
  </style>
</head>
<body>

<!-- Portrait warning -->
<div id="portrait-warn">
  <div class="pw-phone">📱</div>
  <div class="pw-title">ROTATE YOUR DEVICE</div>
  <div class="pw-bar"></div>
  <div class="pw-sub">Contra requires landscape mode</div>
</div>

<div id="wrapper">
  <canvas id="c"></canvas>
</div>

<!-- Touch controls -->
<div id="controls">
  <div id="joy-zone">
    <div id="joy-base"><div id="joy-knob"></div></div>
  </div>
  <div id="btn-jump">▲</div>
  <div id="btn-shoot">🔫</div>
  <div id="btn-up">↑🔫</div>
  <div id="autoshoot-badge">🔫 AUTO</div>
</div>

<!-- Tutorial -->
<div id="touch-tutorial">
  <div class="tut-left">
    <span class="tut-icon">🕹️</span>
    <span class="tut-label">DRAG TO MOVE</span>
  </div>
  <div class="tut-right">
    <span class="tut-icon">⬆️</span>
    <span class="tut-label">JUMP</span>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  CONTRA — HTML5 Canvas
//  Based on cool-mist/Contra (Python/Pygame)
//  Converted to JavaScript/Canvas
// ═══════════════════════════════════════════════════

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// ── SETTINGS (from settings.py) ──
const W = 600, H = 480, FPS = 60;
const GRAVITY       = 0.6;
const PLAYER_ACC    = 0.5;
const PLAYER_FRC    = -0.12;
const PLAYER_JUMP   = -15;
const PLAYER_HP     = 20;
const PLAYER_W      = 28, PLAYER_H = 48;
const BLINK_TIME    = 10;
const BLINK_SPEED   = 20;
const BLINK_RETRACT = 500;
const BULLET_SPD    = 10;
const SNIPER_RANGE  = 500;
const SOLDIER_SPD   = 3;
const SOLDIER_TIMER = 120;
const CAM_RIGHT     = -6164;
const WORLD_W       = 6764;

// ── resize canvas — fullscreen مثل BulletHead ──
function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  const s  = Math.min(ww/W, wh/H);
  canvas.style.width  = Math.floor(W*s)+'px';
  canvas.style.height = Math.floor(H*s)+'px';
  canvas.width=W; canvas.height=H;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,400));
resize();

// prevent pull-to-refresh
document.addEventListener('touchmove', e=>{
  const overlay = document.getElementById('pz-overlay');
  if(!overlay?.classList.contains('show')) e.preventDefault();
},{passive:false});
document.addEventListener('contextmenu', e=>e.preventDefault());

// fullscreen API
let _fsRequested = false;
document.addEventListener('touchstart',()=>{
  if(_fsRequested) return; _fsRequested=true;
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req) req.call(el).catch(()=>{});
},{passive:true});

// ── INPUT ──
const keys = {};
document.addEventListener('keydown', e=>{ keys[e.code]=true; e.preventDefault(); });
document.addEventListener('keyup',   e=>{ keys[e.code]=false; });

// ── VECTOR ──
function vec(x=0,y=0){ return {x,y}; }

// ── CAMERA ──
let camX = 0; // world offset (negative = scrolled right)

// world→screen
function wx(x){ return x + camX; }
function wy(y){ return y; }

// ═══════════════════════════════════════════════════
//  PLATFORMS (43 platforms from settings.py)
// ═══════════════════════════════════════════════════
// Format: [worldX, y, width, height]
// Converted from Pygame rect definitions
// ═══════════════════════════════════════════════════
//  WORLD ZONES — 4 مرحله متفاوت
//  Zone 0: Jungle     (x=0    - 1600)
//  Zone 1: Base       (x=1600 - 3200)
//  Zone 2: Snow       (x=3200 - 5000)
//  Zone 3: Fortress   (x=5000 - 6764)
// ═══════════════════════════════════════════════════
const ZONES = [
  { name:'🌿 JUNGLE',   x:0,    endX:1600, sky0:'#061006', sky1:'#0d1a0a', platC:'#2a6010', platT:'#44aa22', groundC:'#1a4008', groundT:'#2a6010', starC:'#88ff88',  fogC:'#00440022' },
  { name:'🏭 BASE',     x:1600, endX:3200, sky0:'#0a0a0a', sky1:'#1a1000', platC:'#444444', platT:'#666666', groundC:'#222222', groundT:'#444444', starC:'#ffcc8888', fogC:'#33220011' },
  { name:'❄️ SNOW',     x:3200, endX:5000, sky0:'#080a18', sky1:'#0a1030', platC:'#6688aa', platT:'#aaccee', groundC:'#334466', groundT:'#6688aa', starC:'#ffffff',   fogC:'#aaccff22' },
  { name:'🏰 FORTRESS', x:5000, endX:6764, sky0:'#0a0008', sky1:'#1a0015', platC:'#553355', platT:'#884488', groundC:'#330033', groundT:'#553355', starC:'#ff88ff',   fogC:'#88004422' },
];

function getZone(worldX) {
  for(let i=ZONES.length-1;i>=0;i--) if(worldX>=ZONES[i].x) return ZONES[i];
  return ZONES[0];
}
// zone فعلی بر اساس camera
function currentZone() { return getZone(-camX + W/2); }

const PLATFORMS_DEF = [
  // ── GROUND (کل جهان) ──
  [0, H-20, WORLD_W, 20],

  // ════ ZONE 0: JUNGLE (x=0-1600) ════
  // درخت‌وار — پله‌ای بالا میره
  [200,  H-80,  60,  12],
  [320,  H-130, 80,  12],
  [460,  H-80,  60,  12],
  [580,  H-160, 100, 12],
  [720,  H-100, 70,  12],
  [840,  H-200, 80,  12],
  [960,  H-130, 60,  12],
  [1060, H-80,  90,  12],
  [1180, H-170, 70,  12],
  [1320, H-220, 120, 12],
  [1440, H-130, 80,  12],
  [1100, H-270, 60,  12],  // بالاترین نقطه jungle
  [950,  H-310, 50,  12],
  [800,  H-270, 60,  12],

  // ════ ZONE 1: BASE (x=1600-3200) ════
  // صاف‌تر — مثل کارخانه، platform های عریض
  [1650, H-100, 160, 14],
  [1850, H-60,  200, 14],
  [2080, H-120, 140, 14],
  [2260, H-180, 100, 14],
  [2400, H-100, 180, 14],
  [2620, H-60,  120, 14],
  [2780, H-140, 160, 14],
  [2980, H-80,  140, 14],
  [3100, H-200, 80,  14],
  // پله‌های بالا توی base
  [1700, H-200, 80,  14],
  [1820, H-280, 80,  14],
  [1940, H-340, 80,  14],
  [2700, H-220, 80,  14],
  [2820, H-300, 80,  14],
  // سکوی وسط base
  [2200, H-260, 200, 14],

  // ════ ZONE 2: SNOW (x=3200-5000) ════
  // برفی — platform های کوچیک، فاصله زیاد (سخت‌تر)
  [3250, H-100, 70,  12],
  [3380, H-160, 60,  12],
  [3500, H-100, 70,  12],
  [3640, H-200, 50,  12],
  [3750, H-130, 60,  12],
  [3880, H-80,  80,  12],
  [4020, H-180, 55,  12],
  [4140, H-250, 60,  12],
  [4300, H-160, 70,  12],
  [4440, H-100, 60,  12],
  [4580, H-220, 55,  12],
  [4720, H-150, 70,  12],
  [4850, H-90,  80,  12],
  // یخچال بالا
  [3600, H-300, 120, 12],
  [4000, H-320, 100, 12],
  [4400, H-340, 80,  12],

  // ════ ZONE 3: FORTRESS (x=5000-6764) ════
  // قلعه — platform های بزرگ با دیوار
  [5050, H-80,  200, 16],
  [5300, H-60,  150, 16],
  [5500, H-140, 180, 16],
  [5720, H-80,  160, 16],
  [5920, H-180, 140, 16],
  [6100, H-100, 120, 16],
  [6260, H-60,  200, 16],
  // برج‌های قلعه — platform بالا
  [5100, H-220, 100, 16],
  [5300, H-280, 80,  16],
  [5550, H-320, 100, 16],
  [5800, H-260, 80,  16],
  [6050, H-300, 100, 16],
  [6300, H-240, 80,  16],
  // سکوی boss
  [5900, H-200, 300, 16],
];

// ═══════════════════════════════════════════════════
//  GAME ENTITIES
// ═══════════════════════════════════════════════════

// ── PLAYER ──
let P;
function makePlayer(){
  return {
    wx: 100, y: H-20-PLAYER_H,
    vx:0, vy:0, ax:0, ay:0,
    facing: 1,
    aimY: 0,
    onGround: false,
    hp: PLAYER_HP,
    dead: false,
    deathTimer: 0,
    invincible: 0,
    blinking: false,
    blinkTimer: 0,
    blinkCooldown: 0,
    shootCD: 0,
    walkFrame: 0,
    walkTimer: 0,
    shirtColor: CONTRA_CFG.hero_color || '#cc2200', // از config
    mobileShoot: false,
  };
}

// ── BULLETS ──
let bullets    = []; // player bullets
let eBullets   = []; // enemy bullets

// ── ENEMIES ──
let soldiers   = [];
let snipers    = [];
let tanks      = [];
let boss       = null;
let powerups   = [];
let particles  = [];

// sniper positions (world X, Y)
const SNIPER_POSITIONS = [
  [600,310],[900,230],[1200,250],[1500,270],[1800,290],
  [2100,180],[2400,220],[2700,200],[3000,160],[3300,240],[3600,200]
];

// tank positions
const TANK_POSITIONS = [
  [1000,H-20-60],[1800,H-20-60],[2600,H-20-60],
  [3400,H-20-60],[4200,H-20-60],[5000,H-20-60],[5800,H-20-60]
];

// ── GAME STATE ──
let state = 'title'; // title | playing | gameover | stageclear
let frame = 0;
let soldierTimer = 0;
let soldierWaveX = 800;
let score = 0;
let stageTimer = 0;

// ═══════════════════════════════════════════════════
//  PHYSICS HELPERS
// ═══════════════════════════════════════════════════
function platCollide(ent, pw, ph){
  ent.onGround = false;
  for(const [px,py,pw2,ph2] of PLATFORMS_DEF){
    const ex = ent.wx, ey = ent.y;
    const ew = pw, eh = ph;
    if(ex+ew > px && ex < px+pw2 &&
       ey+eh >= py && ey+eh-ent.vy <= py+4 && ent.vy >= 0){
      ent.y = py - eh;
      ent.vy = 0;
      ent.onGround = true;
    }
  }
  // floor
  if(ent.y + ph > H-20){ ent.y=H-20-ph; ent.vy=0; ent.onGround=true; }
}

function overlap(ax,ay,aw,ah, bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

// ═══════════════════════════════════════════════════
//  INIT GAME
// ═══════════════════════════════════════════════════
function initGame(){
  P = makePlayer();
  bullets=[]; eBullets=[]; soldiers=[]; powerups=[]; particles=[];
  score=0; frame=0; camX=0; soldierTimer=0; soldierWaveX=800;
  _scoreSaved = false; // reset برای بازی جدید
  stageTimer=0;

  // init snipers
  snipers = SNIPER_POSITIONS.map(([wx,y])=>({
    wx, y, w:24, h:36,
    hp:3, hitFlash:0,
    shootTimer: Math.floor(Math.random()*60),
    shootRate:60, dead:false
  }));

  // init tanks
  tanks = TANK_POSITIONS.map(([wx,y])=>({
    wx, y:y-60, w:80, h:60,
    hp:15, hitFlash:0,
    shootTimer:60, dead:false,
    wheelAnim:0
  }));

  // boss
  boss = {
    wx:6200, y:H-20-100,
    w:100, h:100,
    hp:50, maxHp:50,
    hitFlash:0,
    phase:0,
    vx:-1.5, vy:0,
    onGround:false,
    shootTimer:0,
    dead:false,
    walkFrame:0, walkTimer:0,
  };
}

// ═══════════════════════════════════════════════════
//  SHOOT
// ═══════════════════════════════════════════════════
function playerShoot(){
  if(P.dead || P.shootCD>0) return;
  // 8-direction
  const sx = P.facing; // -1 or 1
  const sy = P.aimY;   // -1, 0, 1
  const len = Math.sqrt(sx*sx+sy*sy)||1;
  bullets.push({
    wx: P.wx+(P.facing>0?PLAYER_W+2:-10),
    y:  P.y + PLAYER_H/2 - 4,
    vx: (sx/len)*BULLET_SPD,
    vy: (sy/len)*BULLET_SPD,
    w:8, h:8,
  });
  P.shootCD = 12;
}

function enemyShoot(ex, ey, tx, ty, spd){
  const dx=tx-ex, dy=ty-ey;
  const len=Math.sqrt(dx*dx+dy*dy)||1;
  eBullets.push({
    wx:ex, y:ey,
    vx:(dx/len)*spd,
    vy:(dy/len)*spd,
    w:7,h:7,
  });
}

// ═══════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════
function updatePlayer(){
  if(P.dead){
    P.deathTimer--;
    if(P.deathTimer<=0){
      if(P.hp<=0) { state='gameover'; }
      else { P.dead=false; P.invincible=180; P.y=H-20-PLAYER_H; }
    }
    return;
  }

  // ── input ──
  P.ax = 0;
  // movement
  if(keys['KeyA']||keys['ArrowLeft']||joyDx<-0.1){
    P.ax = -PLAYER_ACC; P.facing=-1;
  } else if(keys['KeyD']||keys['ArrowRight']||joyDx>0.1){
    P.ax = PLAYER_ACC;  P.facing=1;
  }
  // aim
  P.aimY = 0;
  if(keys['ArrowUp']   ||keys['KeyW']) P.aimY=-1;
  if(keys['ArrowDown'] ||keys['KeyS']) P.aimY=1;

  // jump
  if((keys['Space']||keys['KeyZ']||jumpPressed) && P.onGround){
    P.vy = PLAYER_JUMP;
    P.onGround=false;
    jumpPressed=false;
  }
  // shoot
  if(keys['KeyX']||keys['KeyJ']) playerShoot();

  // blink/dash
  if((keys['ShiftLeft']||keys['KeyC']) && P.blinkCooldown<=0 && !P.blinking){
    P.blinking=true; P.blinkTimer=BLINK_TIME;
    P.blinkCooldown=BLINK_RETRACT;
  }

  if(P.blinking){
    P.wx += P.facing * BLINK_SPEED;
    P.blinkTimer--;
    if(P.blinkTimer<=0) P.blinking=false;
  } else {
    // friction + acc
    P.ax += P.vx * PLAYER_FRC;
    P.vx += P.ax;
    if(Math.abs(P.vx)<0.1) P.vx=0;

    // gravity
    P.vy += GRAVITY;
    P.y  += P.vy;
    P.wx += P.vx;
  }

  // camera follows player (clamp)
  const targetCam = W/2 - P.wx;
  camX += (targetCam - camX) * 0.1;
  if(camX > 0)         camX=0;
  if(camX < CAM_RIGHT) camX=CAM_RIGHT;

  // bounds
  if(P.wx < 0)           P.wx=0;
  if(P.wx+PLAYER_W>WORLD_W) P.wx=WORLD_W-PLAYER_W;

  platCollide(P, PLAYER_W, PLAYER_H);

  if(P.shootCD>0)       P.shootCD--;
  if(P.invincible>0)    P.invincible--;
  if(P.blinkCooldown>0) P.blinkCooldown--;

  // walk anim
  if(Math.abs(P.vx)>0.5&&P.onGround){
    P.walkTimer++; if(P.walkTimer>8){P.walkTimer=0;P.walkFrame^=1;}
  } else P.walkFrame=0;
}

function updateBullets(){
  // player bullets
  bullets = bullets.filter(b=>{
    b.wx+=b.vx; b.y+=b.vy;
    const sx=wx(b.wx);
    if(sx<-20||sx>W+20||b.y<-20||b.y>H+20) return false;

    // hit snipers
    for(let i=snipers.length-1;i>=0;i--){
      const s=snipers[i];
      if(s.dead) continue;
      if(overlap(b.wx,b.y,b.w,b.h,s.wx,s.y,s.w,s.h)){
        s.hp--; s.hitFlash=8;
        spawnParticle(b.wx,b.y,'#ffaa00');
        if(s.hp<=0){ s.dead=true; score+=200; spawnExplosion(s.wx+s.w/2,s.y+s.h/2); }
        return false;
      }
    }
    // hit tanks
    for(let i=tanks.length-1;i>=0;i--){
      const t=tanks[i];
      if(t.dead) continue;
      if(overlap(b.wx,b.y,b.w,b.h,t.wx,t.y,t.w,t.h)){
        t.hp--; t.hitFlash=8;
        spawnParticle(b.wx,b.y,'#ff8800');
        if(t.hp<=0){ t.dead=true; score+=500; spawnExplosion(t.wx+t.w/2,t.y+t.h/2); spawnPowerup(t.wx+t.w/2,t.y); }
        return false;
      }
    }
    // hit soldiers
    for(let i=soldiers.length-1;i>=0;i--){
      const s=soldiers[i];
      if(overlap(b.wx,b.y,b.w,b.h,s.wx,s.y,s.w,s.h)){
        score+=100; spawnExplosion(s.wx+s.w/2,s.y+s.h/2);
        soldiers.splice(i,1); return false;
      }
    }
    // hit boss
    if(boss&&!boss.dead){
      if(overlap(b.wx,b.y,b.w,b.h,boss.wx,boss.y,boss.w,boss.h)){
        boss.hp--; boss.hitFlash=8;
        spawnParticle(b.wx,b.y,'#ff2200');
        if(boss.hp<=0){
          boss.dead=true; score+=2000;
          spawnExplosion(boss.wx+boss.w/2,boss.y+boss.h/2);
          spawnExplosion(boss.wx+20,boss.y+20);
          spawnExplosion(boss.wx+boss.w-20,boss.y+30);
          setTimeout(()=>{ state='stageclear'; },1500);
        }
        return false;
      }
    }
    return true;
  });

  // enemy bullets
  eBullets = eBullets.filter(b=>{
    b.wx+=b.vx; b.y+=b.vy;
    const sx=wx(b.wx);
    if(sx<-20||sx>W+20||b.y<-20||b.y>H+20) return false;
    if(!P.dead&&P.invincible===0&&overlap(b.wx,b.y,b.w,b.h,P.wx,P.y,PLAYER_W,PLAYER_H)){
      hitPlayer(); return false;
    }
    return true;
  });
}

function hitPlayer(){
  if(P.invincible>0||P.dead) return;
  P.hp--;
  if(P.hp<=0){ P.dead=true; P.deathTimer=90; }
  else P.invincible=120;
}

function updateSnipers(){
  for(const s of snipers){
    if(s.dead) return;
    if(s.hitFlash>0) s.hitFlash--;
    const dist=Math.abs(P.wx-(s.wx+s.w/2));
    if(dist<SNIPER_RANGE&&!P.dead){
      s.shootTimer++;
      if(s.shootTimer>=s.shootRate){
        s.shootTimer=0;
        enemyShoot(s.wx+s.w/2,s.y+s.h/2,P.wx+PLAYER_W/2,P.y+PLAYER_H/2,4);
      }
    }
  }
}

function updateSoldiers(){
  // spawn
  soldierTimer++;
  if(soldierTimer>=SOLDIER_TIMER){
    soldierTimer=0;
    // spawn from right side of screen
    const spawnWx = P.wx+W;
    if(spawnWx < WORLD_W-100){
      soldiers.push({
        wx:spawnWx, y:H-20-40,
        w:22, h:40,
        vx:-SOLDIER_SPD,
        vy:0, onGround:false,
        walkFrame:0, walkTimer:0,
      });
    }
  }
  soldiers = soldiers.filter(s=>{
    s.vy+=GRAVITY;
    s.wx+=s.vx;
    s.y+=s.vy;
    platCollide(s,s.w,s.h);
    s.walkTimer++; if(s.walkTimer>8){s.walkTimer=0;s.walkFrame^=1;}
    // collide with player
    if(!P.dead&&P.invincible===0&&overlap(s.wx,s.y,s.w,s.h,P.wx,P.y,PLAYER_W,PLAYER_H)){
      hitPlayer();
    }
    return wx(s.wx)>-60;
  });
}

function updateTanks(){
  for(const t of tanks){
    if(t.dead){ if(t.hitFlash>0)t.hitFlash--; continue; }
    if(t.hitFlash>0) t.hitFlash--;
    t.wheelAnim++;
    const dist=Math.abs(P.wx-(t.wx+t.w/2));
    if(dist<600&&!P.dead){
      t.shootTimer--;
      if(t.shootTimer<=0||t.shootTimer===-5){
        if(t.shootTimer<=0) t.shootTimer=80;
        enemyShoot(t.wx+t.w/2,t.y+t.h/2,P.wx+PLAYER_W/2,P.y+PLAYER_H/2,3.5);
      }
    }
    if(!P.dead&&P.invincible===0&&overlap(t.wx,t.y,t.w,t.h,P.wx,P.y,PLAYER_W,PLAYER_H)){
      hitPlayer();
    }
  }
}

function updateBoss(){
  if(!boss||boss.dead) return;
  if(boss.hitFlash>0) boss.hitFlash--;

  // gravity
  boss.vy+=GRAVITY*0.5;
  boss.y+=boss.vy;
  boss.wx+=boss.vx;
  platCollide(boss,boss.w,boss.h);

  // bounce walls
  if(boss.wx<5500){ boss.wx=5500; boss.vx=Math.abs(boss.vx); }
  if(boss.wx+boss.w>WORLD_W-20){ boss.wx=WORLD_W-20-boss.w; boss.vx=-Math.abs(boss.vx); }

  // phase sinusoidal jump
  boss.phase+=0.02;
  if(boss.onGround && Math.sin(boss.phase)>0.8){
    boss.vy=-12; boss.onGround=false;
  }

  // shoot at player
  if(!P.dead){
    boss.shootTimer++;
    if(boss.shootTimer>=50){
      boss.shootTimer=0;
      enemyShoot(boss.wx+boss.w/2,boss.y+boss.h/2,P.wx+PLAYER_W/2,P.y+PLAYER_H/2,4);
      // rage: 3 bullets
      if(boss.hp<boss.maxHp/2){
        enemyShoot(boss.wx+boss.w/2,boss.y+boss.h/2,P.wx+PLAYER_W/2,P.y+PLAYER_H/2-30,4);
        enemyShoot(boss.wx+boss.w/2,boss.y+boss.h/2,P.wx+PLAYER_W/2,P.y+PLAYER_H/2+30,4);
      }
    }
    // collision
    if(P.invincible===0&&overlap(boss.wx,boss.y,boss.w,boss.h,P.wx,P.y,PLAYER_W,PLAYER_H)) hitPlayer();
  }
  boss.walkTimer++; if(boss.walkTimer>6){boss.walkTimer=0;boss.walkFrame=(boss.walkFrame||0)^1;}
}

function updatePowerups(){
  powerups=powerups.filter(p=>{
    if(!p.landed){ p.vy+=GRAVITY; p.y+=p.vy; if(p.y>=170){p.y=170;p.vy=0;p.landed=true;} }
    p.bob=(p.bob||0)+0.08;
    if(!P.dead&&overlap(p.wx,p.y+Math.sin(p.bob)*4,24,24,P.wx,P.y,PLAYER_W,PLAYER_H)){
      collectPowerup(p); return false;
    }
    return wx(p.wx)>-60;
  });
}

function collectPowerup(p){
  if(p.type==='hp')  { P.hp=Math.min(P.hp+5,PLAYER_HP); }
  if(p.type==='dash'){ P.blinkCooldown=0; }
  if(p.type==='rapid'){ P.shootCD=0; }
  spawnExplosion(p.wx+12,p.y+12);
}

function spawnPowerup(wx,y){
  const types=['hp','dash','rapid'];
  powerups.push({wx:wx-12,y:y-30,vy:-3,landed:false,type:types[Math.floor(Math.random()*3)]});
}

function spawnExplosion(x,y){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    particles.push({wx:x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:30,col:Math.random()<0.5?'#ff6600':'#ffcc00'});
  }
}

function spawnParticle(x,y,col){
  for(let i=0;i<5;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*3+1;
    particles.push({wx:x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:20,col});
  }
}

function updateParticles(){
  particles=particles.filter(p=>{
    p.wx+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; return p.life>0;
  });
}

// ═══════════════════════════════════════════════════

function drawBackground(){
  const z = currentZone();

  // ── sky gradient ──
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, z.sky0);
  g.addColorStop(1, z.sky1);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // ── fog overlay (zone color) ──
  if(z.fogC){
    ctx.fillStyle=z.fogC;
    ctx.fillRect(0,0,W,H);
  }

  // ── stars / particles ──
  ctx.fillStyle=z.starC+'66';
  for(let i=0;i<60;i++){
    const sx=((i*137+camX*0.1)%W+W)%W;
    const sy=(i*97)%180;
    ctx.fillRect(sx,sy,i%3===0?2:1,i%3===0?2:1);
  }

  // ── zone-specific background elements ──
  const worldX = -camX; // camera position in world

  if(z.name.includes('JUNGLE')){
    // درخت‌های انبوه
    ctx.fillStyle='#0a2a08';
    for(let i=0;i<18;i++){
      const tx=((i*380+(camX*0.3))%(W+300)+W+300)%(W+300)-150;
      // تنه
      ctx.fillRect(tx+12,H-20-80,8,80);
      // برگ‌ها
      ctx.fillStyle='#1a4a12';
      ctx.beginPath();ctx.arc(tx+16,H-20-90,28,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#246a1a';
      ctx.beginPath();ctx.arc(tx+16,H-20-115,20,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#0a2a08';
    }
    // بوته‌های کوچیک
    ctx.fillStyle='#1a3a10';
    for(let i=0;i<25;i++){
      const bx=((i*270+(camX*0.6))%(W+200)+W+200)%(W+200)-100;
      ctx.beginPath();ctx.arc(bx,H-20,12+i%4*4,Math.PI,0);ctx.fill();
    }

  } else if(z.name.includes('BASE')){
    // کارخانه — دودکش و دیوار
    ctx.fillStyle='#1a1a1a';
    for(let i=0;i<8;i++){
      const bx=((i*520+(camX*0.25))%(W+400)+W+400)%(W+400)-200;
      // ساختمان
      ctx.fillRect(bx,H-20-120,90,120);
      // دودکش
      ctx.fillStyle='#111';
      ctx.fillRect(bx+10,H-20-180,20,60);
      ctx.fillRect(bx+55,H-20-160,20,40);
      // دود
      ctx.fillStyle='rgba(80,80,80,0.3)';
      ctx.beginPath();ctx.arc(bx+20,H-20-185,15,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(bx+28,H-20-195,10,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1a1a1a';
    }
    // پنجره‌ها
    ctx.fillStyle='#ffcc0044';
    for(let i=0;i<20;i++){
      const wx2=((i*130+(camX*0.25))%(W+100)+W+100)%(W+100)-50;
      const wy=H-20-40-Math.floor(i/5)*30;
      ctx.fillRect(wx2,wy,10,8);
    }

  } else if(z.name.includes('SNOW')){
    // کوه‌های برفی
    ctx.fillStyle='#1a2a44';
    for(let i=0;i<12;i++){
      const mx=((i*500+(camX*0.15))%(W+400)+W+400)%(W+400)-200;
      const mh=80+i%4*40;
      ctx.beginPath();
      ctx.moveTo(mx,H-20);
      ctx.lineTo(mx+100,H-20-mh);
      ctx.lineTo(mx+200,H-20);
      ctx.fill();
      // برف روی قله
      ctx.fillStyle='#ddeeff';
      ctx.beginPath();
      ctx.moveTo(mx+100,H-20-mh);
      ctx.lineTo(mx+75,H-20-mh+30);
      ctx.lineTo(mx+125,H-20-mh+30);
      ctx.fill();
      ctx.fillStyle='#1a2a44';
    }
    // دانه‌های برف
    ctx.fillStyle='rgba(200,220,255,0.6)';
    for(let i=0;i<40;i++){
      const sx=((i*173+frame*0.5+camX*0.05)%W+W)%W;
      const sy=((i*97+frame*0.8)%(H-20)+H-20)%(H-20);
      ctx.fillRect(sx,sy,2,2);
    }

  } else if(z.name.includes('FORTRESS')){
    // دیوارهای قلعه تاریک
    ctx.fillStyle='#220022';
    for(let i=0;i<10;i++){
      const fx=((i*600+(camX*0.2))%(W+500)+W+500)%(W+500)-250;
      // برج
      ctx.fillRect(fx,H-20-200,60,200);
      ctx.fillRect(fx-10,H-20-220,80,25);
      // برج‌های کوچیک بالا
      ctx.fillRect(fx-5,H-20-240,15,22);
      ctx.fillRect(fx+50,H-20-240,15,22);
      // پنجره‌های قرمز
      ctx.fillStyle='#ff000066';
      ctx.fillRect(fx+22,H-20-160,16,20);
      ctx.fillRect(fx+22,H-20-120,16,20);
      ctx.fillStyle='#220022';
    }
    // جرقه‌های جادویی
    ctx.fillStyle='rgba(200,0,255,0.4)';
    for(let i=0;i<15;i++){
      const sx=((i*211+frame*1.2+camX*0.1)%W+W)%W;
      const sy=((i*137+frame*0.7)%(H/2)+50);
      ctx.beginPath();ctx.arc(sx,sy,2+i%3,0,Math.PI*2);ctx.fill();
    }
  }

  // ── zone name banner ──
  const zoneProgress = Math.max(0,Math.min(1,(-camX-z.x)/(z.endX-z.x)));
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(0,H-45,W*zoneProgress,3);
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.font='bold 10px Arial Black';
  ctx.textAlign='right';
  ctx.fillText(z.name, W-8, H-50);
  ctx.textAlign='left';
}

function drawPlatforms(){
  const z = currentZone();
  for(const [px,py,pw,ph] of PLATFORMS_DEF){
    if(py >= H-20) continue; // ground رو جدا می‌کشیم
    const sx=wx(px);
    if(sx>W+10||sx+pw<-10) continue;

    // shadow
    ctx.fillStyle='#00000055';
    ctx.fillRect(sx+3,py+4,pw,ph);

    // platform body — رنگ بر اساس zone
    const pz = getZone(px);
    ctx.fillStyle = pz.platC;
    ctx.fillRect(sx,py,pw,ph);

    // top strip
    ctx.fillStyle = pz.platT;
    ctx.fillRect(sx,py,pw,4);

    // zone-specific decoration
    if(pz.name.includes('JUNGLE')){
      // علف‌های کوچیک
      ctx.fillStyle='#44cc22';
      for(let bx=sx+5;bx<sx+pw-5;bx+=12){
        ctx.fillRect(bx,py-4,2,5);
        ctx.fillRect(bx+4,py-6,2,7);
      }
    } else if(pz.name.includes('BASE')){
      // خط‌های فلزی
      ctx.fillStyle='#00000033';
      for(let bx=sx;bx<sx+pw;bx+=16) ctx.fillRect(bx,py,2,ph);
      ctx.fillStyle='#ffffff11';
      ctx.fillRect(sx,py+ph-2,pw,2);
    } else if(pz.name.includes('SNOW')){
      // برف روی platform
      ctx.fillStyle='rgba(200,230,255,0.8)';
      ctx.fillRect(sx,py,pw,4);
      // icicles
      ctx.fillStyle='rgba(180,220,255,0.6)';
      for(let bx=sx+6;bx<sx+pw-4;bx+=10){
        ctx.beginPath();
        ctx.moveTo(bx,py+ph);
        ctx.lineTo(bx+3,py+ph+6);
        ctx.lineTo(bx+6,py+ph);
        ctx.fill();
      }
    } else if(pz.name.includes('FORTRESS')){
      // سنگ قلعه
      ctx.fillStyle='#00000044';
      for(let bx=sx;bx<sx+pw;bx+=20) ctx.fillRect(bx,py,1,ph);
      for(let by=py;by<py+ph;by+=8)  ctx.fillRect(sx,by,pw,1);
      // گلویی
      ctx.fillStyle='#cc44ff33';
      ctx.fillRect(sx,py,pw,3);
    }
  }
}

function drawPlatforms(){
  for(const [px,py,pw,ph] of PLATFORMS_DEF){
    const sx=wx(px);
    if(sx>W||sx+pw<0) continue;
    // shadow
    ctx.fillStyle='#00000044';
    ctx.fillRect(sx+3,py+3,pw,ph);
    // platform body
    ctx.fillStyle='#3a6e1a';
    ctx.fillRect(sx,py,pw,ph);
    // top grass
    ctx.fillStyle='#55aa22';
    ctx.fillRect(sx,py,pw,3);
    // brick lines
    ctx.fillStyle='#00000022';
    for(let bx=sx;bx<sx+pw;bx+=20) ctx.fillRect(bx,py,1,ph);
  }
}

function drawPlayer(){
  if(P.dead) return;
  if(P.invincible>0&&Math.floor(P.invincible/6)%2===0) return;

  const sx=wx(P.wx), sy=P.y;
  ctx.save();
  ctx.translate(sx+(P.facing>0?0:PLAYER_W),sy);
  ctx.scale(P.facing,1);

  const lL=P.walkFrame?4:0, lR=P.walkFrame?0:4;
  const aw=P.walkFrame?3:-3;

  // legs
  ctx.fillStyle='#003399';
  ctx.fillRect(2,32,10,16+lL);
  ctx.fillRect(14,32,10,16+lR);
  // boots
  ctx.fillStyle='#111';
  ctx.fillRect(1,48+lL,12,5);
  ctx.fillRect(13,48+lR,12,5);
  // body — از config color استفاده کن
  const sColor = P.shirtColor || CONTRA_CFG.hero_color || '#cc2200';
  ctx.fillStyle = P.blinking ? '#ffff00' : sColor;
  ctx.fillRect(2,14,PLAYER_W-4,20);
  // arms
  ctx.fillStyle = P.blinking ? '#ffff00' : sColor;
  ctx.fillRect(-4,14+aw,8,12);
  ctx.fillRect(PLAYER_W-4,14-aw,8,12);
  // gun
  ctx.fillStyle='#444';
  if(P.aimY<0){
    ctx.fillRect(PLAYER_W-2,2,12,5);  // up
  } else if(P.aimY>0){
    ctx.fillRect(PLAYER_W-2,26,12,5); // down-ish
  } else {
    ctx.fillRect(PLAYER_W-2,16,14,5); // level
  }
  // head
  ctx.fillStyle='#ffcc99';
  ctx.fillRect(5,0,16,14);
  // helmet
  ctx.fillStyle = sColor;
  ctx.fillRect(3,-5,20,8);
  // eyes
  ctx.fillStyle='#111';
  ctx.fillRect(13,3,5,4);

  ctx.restore();

  // blink cooldown bar
  if(P.blinkCooldown>0){
    const pct=1-P.blinkCooldown/BLINK_RETRACT;
    ctx.fillStyle='#333'; ctx.fillRect(sx,sy-10,PLAYER_W,4);
    ctx.fillStyle='#00ccff'; ctx.fillRect(sx,sy-10,PLAYER_W*pct,4);
  }
}

function drawSnipers(){
  for(const s of snipers){
    if(s.dead) continue;
    const sx=wx(s.wx), sy=s.y;
    if(sx>W+50||sx+s.w<-50) continue;
    const flash=s.hitFlash>0;
    ctx.fillStyle=flash?'#fff':'#884400';
    // body
    ctx.fillRect(sx+4,sy+14,16,22);
    // head
    ctx.fillStyle=flash?'#fff':'#ffcc99';
    ctx.fillRect(sx+5,sy,14,14);
    // helmet
    ctx.fillStyle=flash?'#fff':'#333';
    ctx.fillRect(sx+3,sy-5,18,8);
    // gun (shoots left always)
    ctx.fillStyle=flash?'#fff':'#222';
    ctx.fillRect(sx-12,sy+16,14,4);
    // HP dots
    for(let i=0;i<s.hp;i++){
      ctx.fillStyle='#00ff44';
      ctx.fillRect(sx+i*6,sy-10,4,4);
    }
  }
}

function drawSoldiers(){
  for(const s of soldiers){
    const sx=wx(s.wx), sy=s.y;
    if(sx>W+50||sx+s.w<-50) continue;
    const lL=s.walkFrame?4:0, lR=s.walkFrame?0:4;
    // legs
    ctx.fillStyle='#336600';
    ctx.fillRect(sx+2,sy+24,8,16+lL);
    ctx.fillRect(sx+12,sy+24,8,16+lR);
    // boots
    ctx.fillStyle='#111';
    ctx.fillRect(sx+1,sy+40+lL,10,4);
    ctx.fillRect(sx+11,sy+40+lR,10,4);
    // body
    ctx.fillStyle='#558800';
    ctx.fillRect(sx+2,sy+10,18,16);
    // head
    ctx.fillStyle='#ffcc99';
    ctx.fillRect(sx+5,sy,12,12);
    // helmet
    ctx.fillStyle='#336600';
    ctx.fillRect(sx+3,sy-4,16,7);
  }
}

function drawTanks(){
  for(const t of tanks){
    if(t.dead) continue;
    const sx=wx(t.wx), sy=t.y;
    if(sx>W+100||sx+t.w<-100) continue;
    const flash=t.hitFlash>0;
    // shadow
    ctx.fillStyle='#00000044';
    ctx.fillRect(sx+4,sy+4,t.w,t.h);
    // body
    ctx.fillStyle=flash?'#fff':'#556600';
    ctx.fillRect(sx,sy+20,t.w,t.h-20);
    // turret
    ctx.fillStyle=flash?'#fff':'#3a4400';
    ctx.fillRect(sx+15,sy,t.w-30,28);
    // barrel
    ctx.fillStyle=flash?'#fff':'#222';
    ctx.fillRect(sx-10,sy+8,20,6);
    // wheels
    ctx.fillStyle=flash?'#fff':'#222';
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.arc(sx+10+i*20, sy+t.h-2, 8, 0, Math.PI*2);
      ctx.fill();
    }
    // hp bar
    const pct=t.hp/15;
    ctx.fillStyle='#333'; ctx.fillRect(sx,sy-12,t.w,6);
    ctx.fillStyle=pct>0.5?'#00ff44':'#ff4400';
    ctx.fillRect(sx,sy-12,t.w*pct,6);
  }
}

function drawBoss(){
  if(!boss||boss.dead) return;
  const sx=wx(boss.wx), sy=boss.y;
  if(sx>W+120||sx+boss.w<-120) return;
  const flash=boss.hitFlash>0;
  const rage=boss.hp<boss.maxHp/2;

  ctx.shadowColor=rage?'#ff0000':'#cc4400';
  ctx.shadowBlur=flash?40:20+Math.sin(frame*0.1)*8;

  const s=c=>flash?'#ffffff':c;

  // body
  ctx.fillStyle=s(rage?'#8b0000':'#aa2200');
  ctx.fillRect(sx+8,sy+40,boss.w-16,50);
  // legs
  const lL=(boss.walkFrame||0)?8:0,lR=(boss.walkFrame||0)?0:8;
  ctx.fillStyle=s('#550000');
  ctx.fillRect(sx+10,sy+90,30,30+lL);
  ctx.fillRect(sx+boss.w-40,sy+90,30,30+lR);
  // feet
  ctx.fillStyle=s('#220000');
  ctx.fillRect(sx+8,sy+120+lL,34,10);
  ctx.fillRect(sx+boss.w-42,sy+120+lR,34,10);
  // arms
  const aw=(boss.walkFrame||0)?5:-5;
  ctx.fillStyle=s(rage?'#770000':'#990000');
  ctx.fillRect(sx-12,sy+42+aw,14,40);
  ctx.fillRect(sx+boss.w-2,sy+42-aw,14,40);
  // head
  ctx.fillStyle=s(rage?'#cc0000':'#dd2200');
  ctx.fillRect(sx+6,sy,boss.w-12,44);
  // horns
  ctx.fillStyle=s('#440000');
  ctx.beginPath(); ctx.moveTo(sx+12,sy); ctx.lineTo(sx+6,sy-22); ctx.lineTo(sx+22,sy-2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sx+boss.w-12,sy); ctx.lineTo(sx+boss.w-6,sy-22); ctx.lineTo(sx+boss.w-22,sy-2); ctx.fill();
  // eyes
  ctx.shadowColor='#ff0000'; ctx.shadowBlur=15;
  ctx.fillStyle=s(rage?'#ffff00':'#ff4400');
  ctx.fillRect(sx+14,sy+10,18,14);
  ctx.fillRect(sx+boss.w-32,sy+10,18,14);
  ctx.fillStyle=s('#000');
  ctx.fillRect(sx+18,sy+13,10,8);
  ctx.fillRect(sx+boss.w-28,sy+13,10,8);
  // teeth
  ctx.shadowBlur=0;
  ctx.fillStyle=s('#fff');
  for(let i=0;i<5;i++) ctx.fillRect(sx+12+i*14,sy+32,8,12);

  // HP bar
  ctx.shadowBlur=0;
  const pct=boss.hp/boss.maxHp;
  const barW=boss.w+20;
  ctx.fillStyle='#222'; ctx.fillRect(sx-10,sy-22,barW,10);
  ctx.fillStyle=pct>0.5?'#ff4400':'#ff0000';
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=8;
  ctx.fillRect(sx-10,sy-22,barW*pct,10);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 8px Arial'; ctx.textAlign='center';
  ctx.fillText('BOSS  '+boss.hp+'/'+boss.maxHp, sx+boss.w/2, sy-24);
  ctx.textAlign='left';
}

function drawBullets(){
  ctx.fillStyle='#ffff00';
  ctx.shadowColor='#ffff00'; ctx.shadowBlur=8;
  for(const b of bullets){
    const sx=wx(b.wx);
    ctx.fillRect(sx,b.y,b.w,b.h);
    ctx.beginPath(); ctx.arc(sx+b.w/2,b.y+b.h/2,4,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#ff3300'; ctx.shadowColor='#ff3300';
  for(const b of eBullets){
    const sx=wx(b.wx);
    ctx.beginPath(); ctx.arc(sx+b.w/2,b.y+b.h/2,5,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawPowerups(){
  for(const p of powerups){
    const sx=wx(p.wx), sy=p.y+Math.sin((p.bob||0))*4;
    const col=p.type==='hp'?'#ff4488':p.type==='dash'?'#00ccff':'#ffcc00';
    ctx.shadowColor=col; ctx.shadowBlur=12;
    ctx.fillStyle=col+'44';
    ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx+12,sy+12,14,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 11px Arial'; ctx.textAlign='center';
    ctx.fillText(p.type==='hp'?'❤':p.type==='dash'?'⚡':'🔫',sx+12,sy+16);
    ctx.shadowBlur=0; ctx.textAlign='left';
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/30;
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=5;
    ctx.fillRect(wx(p.wx)-2,p.y-2,5,5);
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function drawGround(){
  const z = currentZone();
  const g=ctx.createLinearGradient(0,H-20,0,H);
  g.addColorStop(0, z.groundT);
  g.addColorStop(0.15, z.groundC);
  g.addColorStop(1,'#0a0a0a');
  ctx.fillStyle=g;
  ctx.fillRect(0,H-20,W,20);
  // top strip
  ctx.fillStyle=z.groundT;
  ctx.fillRect(0,H-20,W,3);
  // zone decoration on ground
  if(z.name.includes('SNOW')){
    ctx.fillStyle='rgba(200,230,255,0.5)';
    ctx.fillRect(0,H-20,W,3);
  } else if(z.name.includes('FORTRESS')){
    ctx.fillStyle='rgba(150,0,200,0.2)';
    ctx.fillRect(0,H-20,W,3);
  }
}

function drawHUD(){
  ctx.fillStyle='#000000aa'; ctx.fillRect(0,0,W,36);
  // HP
  ctx.fillStyle='#fff'; ctx.font='bold 11px Arial Black';
  ctx.fillText('HP',8,22);
  for(let i=0;i<PLAYER_HP;i++){
    const col=i<P.hp?(P.hp>10?'#00ff44':P.hp>5?'#ffcc00':'#ff2200'):'#333';
    ctx.fillStyle=col;
    ctx.fillRect(32+i*13,10,10,14);
  }
  // score
  ctx.fillStyle='#ffcc00'; ctx.font='bold 13px Arial Black';
  ctx.textAlign='center';
  ctx.fillText('SCORE: '+score, W/2, 22);
  // dash CD
  const pct=1-P.blinkCooldown/BLINK_RETRACT;
  ctx.fillStyle='#00ccff44'; ctx.fillRect(W-82,8,74,10);
  ctx.fillStyle='#00ccff'; ctx.fillRect(W-82,8,74*Math.min(pct,1),10);
  ctx.fillStyle='#fff'; ctx.font='9px Arial'; ctx.textAlign='right';
  ctx.fillText('DASH',W-6,22);
  ctx.textAlign='left';
}

const joyZone  = document.getElementById('joy-zone');
const joyBase  = document.getElementById('joy-base');
const joyKnob  = document.getElementById('joy-knob');
const btnJump  = document.getElementById('btn-jump');

let joyActive=false, joyId=null, joyDx=0, joyOx=0, joyOy=0;
let jumpPressed=false;

const JOY_R=50, JOY_DEAD=8;

joyZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  joyId=t.identifier; joyActive=true;
  joyOx=t.clientX; joyOy=t.clientY;
  joyBase.style.display='block';
  joyBase.style.left=t.clientX+'px'; joyBase.style.top=t.clientY+'px';
  joyKnob.style.left=t.clientX+'px'; joyKnob.style.top=t.clientY+'px';
  // aim up/down from vertical
  const dy=t.clientY-joyOy;
  P&&(P.aimY = dy<-20?-1:dy>20?1:0);
},{passive:false});

joyZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==joyId) continue;
    const dx=t.clientX-joyOx, dy=t.clientY-joyOy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const clamped=Math.min(dist,JOY_R);
    const a=Math.atan2(dy,dx);
    joyBase.style.left=joyOx+'px'; joyBase.style.top=joyOy+'px';
    joyKnob.style.left=(joyOx+Math.cos(a)*clamped)+'px';
    joyKnob.style.top=(joyOy+Math.sin(a)*clamped)+'px';
    joyDx=Math.abs(dx)>JOY_DEAD?Math.max(-1,Math.min(1,dx/JOY_R)):0;
    if(P) P.aimY=dy<-25?-1:dy>25?1:0;
  }
},{passive:false});

['touchend','touchcancel'].forEach(ev=>joyZone.addEventListener(ev,e=>{
  e.preventDefault(); joyActive=false; joyId=null; joyDx=0;
  joyBase.style.display='none';
  if(P) P.aimY=0;
},{passive:false}));

btnJump.addEventListener('touchstart',e=>{
  e.preventDefault(); btnJump.classList.add('pressed');

// ── AUTO-SHOOT — aims at nearest enemy (مثل BulletHead) ──
let _autoShootTimer = 0;

function getNearestContraTarget(){
  let best = null, bestDist = Infinity;
  const px = P.wx + PLAYER_W/2, py = P.y + PLAYER_H/2;

  // boss اول
  if(boss && !boss.dead){
    const dx=(boss.wx+boss.w/2)-px, dy=(boss.y+boss.h/2)-py;
    bestDist=Math.sqrt(dx*dx+dy*dy);
    best={x:boss.wx+boss.w/2, y:boss.y+boss.h/2};
  }
  // snipers
  for(const s of snipers){
    if(s.dead) continue;
    const dx=(s.wx+s.w/2)-px, dy=(s.y+s.h/2)-py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<bestDist){bestDist=d; best={x:s.wx+s.w/2,y:s.y+s.h/2};}
  }
  // soldiers
  for(const s of soldiers){
    const dx=(s.wx+s.w/2)-px, dy=(s.y+s.h/2)-py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<bestDist){bestDist=d; best={x:s.wx+s.w/2,y:s.y+s.h/2};}
  }
  // tanks
  for(const t of tanks){
    if(t.dead) continue;
    const dx=(t.wx+t.w/2)-px, dy=(t.y+t.h/2)-py;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<bestDist){bestDist=d; best={x:t.wx+t.w/2,y:t.y+t.h/2};}
  }
  return best;
}

function autoShootAimed(){
  if(!P||P.dead||P.shootCD>0) return;
  const target = getNearestContraTarget();
  const px = P.wx + PLAYER_W/2, py = P.y + PLAYER_H/2 - 8;

  let vx, vy;
  if(target){
    const dx=target.x-px, dy=target.y-py;
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    vx=(dx/len)*BULLET_SPD;
    vy=(dy/len)*BULLET_SPD;
    // update facing
    if(dx>0) P.facing=1; else if(dx<0) P.facing=-1;
    // update aimY برای animation
    P.aimY = dy < -20 ? -1 : dy > 20 ? 1 : 0;
  } else {
    // هیچ دشمنی نیست → در جهت facing شلیک کن
    vx = P.facing * BULLET_SPD;
    vy = 0;
    P.aimY = 0;
  }

  bullets.push({
    wx: P.wx+(P.facing>0?PLAYER_W+2:-10),
    y:  py,
    vx, vy, w:8, h:8,
  });
  P.shootCD = 14;
}

function updateAutoShoot(){
  if(state!=='playing'||!('ontouchstart' in window)) return;
  if(!P||P.dead) return;
  _autoShootTimer++;
  if(_autoShootTimer >= 14){ _autoShootTimer=0; autoShootAimed(); }
}

let _tutorialShown = false;
function syncControls(){
  const isTouch = 'ontouchstart' in window;

      tut.style.display='block';
      setTimeout(()=>{ tut.style.display='none'; }, 4200);
    } else if(!show){
      tut.style.display='none';
    }
  }
}

// ── Override loop to handle paused + platform ──
function loop(){
  ctx.clearRect(0,0,W,H);
  frame++;

  if(state==='paused'){
    drawBackground(); drawPlatforms(); drawGround();
    drawSnipers(); drawSoldiers(); drawTanks(); drawBoss(); drawPlayer();
    drawHUD();
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.font='bold 22px Arial Black';
    ctx.textAlign='center'; ctx.fillText('⏸ PAUSED',W/2,H/2);
    ctx.textAlign='left';
    requestAnimationFrame(loop); return;
  }

  if(state==='title'){
    drawTitle();
    if(keys['Enter']||keys['Space']){ state='playing'; initGame(); syncControls(); }
  } else if(state==='playing'){
    updatePlayer(); updateBullets(); updateSnipers();
    updateSoldiers(); updateTanks(); updateBoss();
    updatePowerups(); updateParticles();
    updateAutoShoot();
    drawBackground(); drawPlatforms(); drawGround();
    drawParticles(); drawPowerups();
    drawSnipers(); drawSoldiers(); drawTanks(); drawBoss();
    drawBullets(); drawPlayer(); drawHUD();
  } else if(state==='gameover'){
    drawBackground(); drawPlatforms(); drawGround();
    drawSnipers(); drawSoldiers(); drawTanks(); drawBoss();
    drawGameOver();
    saveContraScore();
    if(keys['Enter']){ state='playing'; initGame(); syncControls(); }
  } else if(state==='stageclear'){
    drawBackground(); drawPlatforms(); drawGround();
    drawStageClear();
    saveContraScore();
    if(keys['Enter']){ state='title'; syncControls(); }
  }

  requestAnimationFrame(loop);
}

loop();
