<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BulletHead — Roblox Edition</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      width:100%; height:100%;
      background:#111;
      overflow:hidden;
      user-select:none;
      touch-action:none;
      font-family:'Arial Black','Arial',sans-serif;
    }
    #wrapper {
      position:relative;
      width:100%; height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    #gameCanvas {
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      cursor:pointer;
      /* border + glow applied via JS after resize */
      box-shadow:0 0 30px #00b4d855;
      max-width:100%;
      max-height:100%;
    }
    /* ── TOUCH CONTROLS ── */
    /* کنترل‌ها روی canvas float می‌کنن — canvas تمام صفحه می‌شه */
    #controls {
      position:fixed;
      bottom:0; left:0; right:0;
      height:140px;
      pointer-events:none;
      z-index:10;
    }
    /* گروه چپ — حرکت */
    #ctrl-left-group {
      position:absolute;
      bottom:18px; left:16px;
      display:flex; gap:10px;
      pointer-events:auto;
    }
    /* گروه راست — jump + shoot (کلاستر مثل Dead Cells) */
    #ctrl-right-group {
      position:absolute;
      bottom:18px; right:16px;
      display:flex; gap:10px;
      pointer-events:auto;
      flex-direction:row;
      align-items:flex-end;
    }
    .ctrl-btn {
      width:72px; height:72px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,0.22);
      background:rgba(0,0,0,0.45);
      color:#fff;
      font-size:28px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      transition:background 0.07s, transform 0.07s;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
    }
    .ctrl-btn:active, .ctrl-btn.pressed {
      transform:scale(0.88);
    }
    /* دکمه چپ */
    #btn-left  { border-color:rgba(0,180,216,0.5); }
    #btn-left.pressed  { background:rgba(0,180,216,0.4); border-color:#00b4d8; }
    /* دکمه راست */
    #btn-right { border-color:rgba(0,180,216,0.5); }
    #btn-right.pressed { background:rgba(0,180,216,0.4); border-color:#00b4d8; }
    /* دکمه jump — کمی بزرگتر، سبز */
    #btn-jump {
      width:76px; height:76px;
      font-size:30px;
      border-color:rgba(0,255,136,0.5);
      margin-bottom:8px; /* بالاتر از shoot */
    }
    #btn-jump.pressed { background:rgba(0,255,136,0.4); border-color:#00ff88; }
    /* دکمه shoot — بزرگترین، قرمز */
    #btn-shoot {
      width:86px; height:86px;
      font-size:34px;
      border-color:rgba(255,70,70,0.6);
      background:rgba(100,0,0,0.45);
    }
    #btn-shoot.pressed { background:rgba(255,50,50,0.5); border-color:#ff3333; }

    /* ── PORTRAIT WARNING ── */
    #portrait-warn {
      display:none;
      position:fixed; inset:0;
      background:#000;
      color:#fff;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:20px;
      z-index:9999;
      text-align:center;
      padding:40px;
    }
    #portrait-warn .pw-title {
      font-size:24px;
      font-weight:900;
      font-family:'Arial Black',Arial,sans-serif;
      letter-spacing:1px;
    }
    #portrait-warn .pw-sub {
      font-size:14px;
      color:#888;
      font-family:Arial,sans-serif;
    }
    /* آیکون چرخان با انیمیشن */
    #portrait-warn .pw-phone {
      font-size:72px;
      animation: rotate-hint 1.4s ease-in-out infinite;
      display:inline-block;
      transform-origin:center;
    }
    @keyframes rotate-hint {
      0%   { transform:rotate(0deg);   }
      30%  { transform:rotate(-90deg); }
      60%  { transform:rotate(-90deg); }
      90%  { transform:rotate(0deg);   }
      100% { transform:rotate(0deg);   }
    }
    /* نوار پایین با gradient */
    #portrait-warn .pw-bar {
      width:60px; height:4px;
      border-radius:2px;
      background:linear-gradient(90deg,#00b4d8,#00ff88);
      margin-top:4px;
    }
    @media (orientation:portrait) {
      #portrait-warn { display:flex; }
    }
    /* Hide bottom bar on mobile */
    #bottomBar { display:none; }
  </style>
</head>
<body>
<!-- Portrait warning — با انیمیشن چرخش -->
<div id="portrait-warn">
  <div class="pw-phone">📱</div>
  <div class="pw-title">ROTATE YOUR DEVICE</div>
  <div class="pw-bar"></div>
  <div class="pw-sub">This game requires landscape mode</div>
</div>

<div id="wrapper">
  <canvas id="gameCanvas"></canvas>
</div>

<!-- کنترل‌های لمسی — float روی صفحه، خارج از wrapper -->
<div id="controls" style="display:none">
  <!-- چپ: حرکت -->
  <div id="ctrl-left-group">
    <div class="ctrl-btn" id="btn-left">◀</div>
    <div class="ctrl-btn" id="btn-right">▶</div>
  </div>
  <!-- راست: jump بالا، shoot پایین (مثل Dead Cells) -->
  <div id="ctrl-right-group">
    <div class="ctrl-btn" id="btn-jump">▲</div>
    <div class="ctrl-btn" id="btn-shoot">🔫</div>
  </div>
</div>

<div id="bottomBar"></div>

<script>
// ═══════════════════════════════════════════════
//  CANVAS — fixed logical size, CSS scales it
// ═══════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
// Fixed logical resolution — game coordinates never change
const W = 620, H = 480;
canvas.width  = W;
canvas.height = H;

// Scale canvas to fill full screen — کنترل‌ها float هستن روی بازی
function resizeCanvas() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const scale = Math.min(ww / W, wh / H);
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ═══════════════════════════════════════════════
//  LOCALSTORAGE PERSISTENCE
// ═══════════════════════════════════════════════
function lsGet(k, def) {
  try { const v = localStorage.getItem('bh_' + k); return v === null ? def : JSON.parse(v); }
  catch { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem('bh_' + k, JSON.stringify(v)); } catch {}
}

// ═══════════════════════════════════════════════
//  PERSISTENT DATA
// ═══════════════════════════════════════════════
let coins    = lsGet('coins',   0);
let unlocks  = lsGet('unlocks', ['noob','pistol']);
let selChar  = lsGet('char',    'noob');
let selGun   = lsGet('gun',     'pistol');
let selShirt = lsGet('shirt',   '#e82020');
let selPants = lsGet('pants',   '#00329e');
let bestScore= lsGet('best',    0);

function saveAll() {
  lsSet('coins',  coins);
  lsSet('unlocks',unlocks);
  lsSet('char',   selChar);
  lsSet('gun',    selGun);
  lsSet('shirt',  selShirt);
  lsSet('pants',  selPants);
  lsSet('best',   bestScore);
}

// ═══════════════════════════════════════════════
//  CHARACTERS
// ═══════════════════════════════════════════════
const CHARS = {

// ═══════════════════════════════════════════════
//  OUTFIT PALETTE
// ═══════════════════════════════════════════════
const PALETTE = [

// ═══════════════════════════════════════════════

const THEMES = [

  { name:'🔥 Lava',     sky0:'#1a0500',sky1:'#2d0a00', platC:'#992200',platT:'#ff4400',groundC:'#660000',groundT:'#cc2200',starC:'#ff6600',ambientC:'#ff4400' },
  { name:'🌌 Space',    sky0:'#000008',sky1:'#04000c', platC:'#333366',platT:'#6666aa',groundC:'#1a1a33',groundT:'#333366',starC:'#ffffff',ambientC:'#8888ff' },
  { name:'🏜️ Desert',   sky0:'#1a1200',sky1:'#2a1e00', platC:'#997722',platT:'#ccaa33',groundC:'#664d00',groundT:'#997722',starC:'#ffdd88',ambientC:'#ffaa00' },
  { name:'🌊 Ocean',    sky0:'#001525',sky1:'#002035', platC:'#116688',platT:'#1188bb',groundC:'#003344',groundT:'#116688',starC:'#88ccff',ambientC:'#00aacc' },
  { name:'⚡ Electric', sky0:'#0d0025',sky1:'#1a0040', platC:'#660099',platT:'#aa33ff',groundC:'#330055',groundT:'#660099',starC:'#dd88ff',ambientC:'#cc00ff' },
  { name:'🏰 Castle',   sky0:'#0a0a12',sky1:'#14141e', platC:'#555577',platT:'#8888aa',groundC:'#333344',groundT:'#555577',starC:'#ccccff',ambientC:'#9999cc' },
  { name:'🌲 Forest',   sky0:'#030a00',sky1:'#061500', platC:'#224411',platT:'#336622',groundC:'#112208',groundT:'#224411',starC:'#88ff99',ambientC:'#44cc55' },
  { name:'🍬 Candy',    sky0:'#200010',sky1:'#300018', platC:'#cc3388',platT:'#ff66bb',groundC:'#880044',groundT:'#cc3388',starC:'#ffaadd',ambientC:'#ff55cc' },
];
let currentThemeIdx = 0;
function getTheme() { return THEMES[currentThemeIdx]; }
function updateTheme() {
  const idx = Math.floor((level-1)/3) % THEMES.length;
  if (idx !== currentThemeIdx) {
    currentThemeIdx = idx;
    mapChangeBannerTimer = 150;
    rebuildStars();
    switchLayout(idx);

}

// ═══════════════════════════════════════════════
//  PLATFORM LAYOUTS (10)
// ═══════════════════════════════════════════════
const ALL_LAYOUTS = [
  [{x:0,y:440,w:620,h:10,isGround:true},{x:50,y:350,w:140,h:10},{x:240,y:295,w:140,h:10},{x:430,y:350,w:140,h:10},{x:110,y:215,w:120,h:10},{x:390,y:215,w:120,h:10},{x:240,y:140,w:140,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:20,y:360,w:110,h:10},{x:160,y:300,w:110,h:10},{x:300,y:240,w:110,h:10},{x:440,y:180,w:110,h:10},{x:100,y:170,w:90,h:10},{x:260,y:130,w:100,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:40,y:370,w:120,h:10},{x:460,y:370,w:120,h:10},{x:220,y:330,w:180,h:10},{x:100,y:240,w:100,h:10},{x:420,y:240,w:100,h:10},{x:240,y:155,w:140,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:0,y:350,w:200,h:10},{x:420,y:350,w:200,h:10},{x:150,y:265,w:320,h:10},{x:30,y:180,w:150,h:10},{x:440,y:180,w:150,h:10},{x:200,y:110,w:220,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:30,y:380,w:90,h:10},{x:500,y:380,w:90,h:10},{x:200,y:320,w:80,h:10},{x:350,y:280,w:80,h:10},{x:70,y:220,w:90,h:10},{x:450,y:210,w:90,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:20,y:390,w:100,h:10},{x:260,y:380,w:100,h:10},{x:500,y:390,w:100,h:10},{x:130,y:280,w:100,h:10},{x:390,y:280,w:100,h:10},{x:10,y:160,w:600,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:0,y:300,w:120,h:10},{x:500,y:300,w:120,h:10},{x:100,y:240,w:100,h:10},{x:420,y:240,w:100,h:10},{x:190,y:185,w:100,h:10},{x:330,y:185,w:100,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:0,y:360,w:130,h:10},{x:240,y:330,w:130,h:10},{x:480,y:300,w:140,h:10},{x:60,y:230,w:130,h:10},{x:310,y:200,w:130,h:10},{x:140,y:135,w:150,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:10,y:370,w:100,h:10},{x:510,y:370,w:100,h:10},{x:10,y:260,w:100,h:10},{x:510,y:260,w:100,h:10},{x:200,y:200,w:220,h:10},{x:260,y:130,w:100,h:10}],
  [{x:0,y:440,w:620,h:10,isGround:true},{x:80,y:395,w:80,h:10},{x:460,y:395,w:80,h:10},{x:180,y:340,w:70,h:10},{x:370,y:310,w:70,h:10},{x:50,y:245,w:80,h:10},{x:490,y:225,w:80,h:10}],
];
let PLAT_LAYOUT = ALL_LAYOUTS[0].map(p=>({...p,isGround:!!p.isGround}));
let platLayoutIdx=0,platTransition=0,platOldLayout=null,platNewLayout=null;
function switchLayout(idx){
  platOldLayout=PLAT_LAYOUT.slice();
  platNewLayout=ALL_LAYOUTS[idx].map(p=>({...p,isGround:!!p.isGround}));
  platLayoutIdx=idx; platTransition=1;
}
function updatePlatTransition(){
  if(!platTransition)return;
  platTransition++;
  if(platTransition===31) PLAT_LAYOUT=platNewLayout;
  if(platTransition>60){ platTransition=0;platOldLayout=platNewLayout=null; }
}

// ═══════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════
let state = 'title'; // title | playing | gameover | shop
let score=0,level=1,kills=0,killsThisLevel=0;
let levelUpTimer=0,mapChangeBannerTimer=0,rewardBannerTimer=0,rewardTimer=0,rewardBurstTimer=0;
let frame=0;
let particles=[],stars=[],floatingTexts=[];
let gameOverCoinsEarned=0; // coins earned this run

function rebuildStars(){
  stars=[];
  for(let i=0;i<70;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,blink:Math.random()*Math.PI*2,speed:Math.random()*0.015+0.005});
}
rebuildStars();

// ═══════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════
function makePlayer(){
  const ch = CHARS[selChar];
  return {
    x:290,y:395,w:24,h:36,
    vx:0,vy:0,onGround:false,facing:1,
    lives:5,shootCD:0,invincible:0,
    powerup:null,powerupTimer:0,
    shield:0,
    dead:false,deathTimer:0,
    walkFrame:0,walkTimer:0,
    head: ch.head,
    hat:  ch.hat,
    shirt: selShirt,
    pants: selPants,
    gunType: selGun,
  };
}
let P = makePlayer();

function getShirtColor(){
  if(P.shield>0) return '#44aaff';
  if(P.powerup==='rapid')  return '#ffff00';
  if(P.powerup==='triple') return '#00ffff';
  return P.shirt;
}

// ═══════════════════════════════════════════════
//  BULLETS
// ═══════════════════════════════════════════════
let bullets=[],eBullets=[];

function shootPlayer(){
  if(P.dead||P.shootCD>0)return;
  const gd = GUNS[P.gunType]||GUNS.pistol;
  // Rapid powerup overrides cooldown
  const cd = P.powerup==='rapid' ? Math.floor(gd.cd*0.4) : gd.cd;
  const bx = P.x+(P.facing>0?P.w+2:-14);
  const by = P.y+12;
  const spd = gd.spd;
  const col = gd.color;

  if(P.powerup==='triple'){
    // Triple powerup: always 3 bullets regardless of gun
    for(let i=-1;i<=1;i++){
      bullets.push({x:bx,y:by,vx:P.facing*(spd-Math.abs(i)),vy:i*2.2,w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  } else {
    for(let i=0;i<gd.count;i++){
      const angle = gd.spread>0 ? (Math.random()-0.5)*gd.spread*2 : 0;
      const spread = gd.spread>0 ? (i/(gd.count-1||1)-0.5)*gd.spread*2 : 0;
      bullets.push({x:bx,y:by,vx:P.facing*spd*Math.cos(spread),vy:spd*Math.sin(spread),w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  }
  P.shootCD=cd;
}

// ═══════════════════════════════════════════════
//  ENEMIES
// ═══════════════════════════════════════════════
let enemies=[];
const ENEMY_PALETTES=[
  {body:'#00b4d8',dark:'#007090',head:'#ffcc99'},
  {body:'#ff4444',dark:'#aa1111',head:'#ffcc99'},
  {body:'#cc44ff',dark:'#7700aa',head:'#ffcc99'},
  {body:'#ffaa00',dark:'#cc6600',head:'#ffcc99'},
  {body:'#44ff88',dark:'#009944',head:'#ffcc99'},
];
function getEnemyDef(){
  return {
    spd:  0.9+level*0.15,
    hp:   level<3?1:level<7?2:3,
    sRate:Math.max(50,200-level*10),
    pts:  60+level*25,
    col:  ENEMY_PALETTES[(level-1)%ENEMY_PALETTES.length],
  };
}
function spawnEnemy(){
  const def=getEnemyDef();
  const side=Math.random()<0.5?-30:W+30;
  const plat=PLAT_LAYOUT[1+Math.floor(Math.random()*(PLAT_LAYOUT.length-1))];
  enemies.push({x:side,y:plat.y-42,baseY:plat.y-42,w:24,h:36,
    vx:side<0?def.spd:-def.spd,vy:0,
    hp:def.hp,maxHp:def.hp,sTimer:Math.floor(Math.random()*def.sRate),
    sRate:def.sRate,pts:def.pts,col:def.col,hitFlash:0,
    phase:Math.random()*Math.PI*2,walkFrame:0,walkTimer:0});
}

// ═══════════════════════════════════════════════
//  POWER-UPS
// ═══════════════════════════════════════════════
let powerups=[];
const POWERUP_DEFS={
  rapid: {icon:'⚡',label:'RAPID FIRE', color:'#ffff00',bg:'#333300'},
  triple:{icon:'✦', label:'TRIPLE SHOT',color:'#00ffff',bg:'#003333'},
  shield:{icon:'🛡', label:'SHIELD!',    color:'#44aaff',bg:'#001133'},
  bomb:  {icon:'💣', label:'BOOM!',      color:'#ff6600',bg:'#331100'},
  life:  {icon:'❤',  label:'+1 UP!',    color:'#ff4488',bg:'#330011'},
};
function dropPowerup(x,y,type){ powerups.push({x,y,type,vy:-4,bob:0,life:600,landed:false}); }
function maybeDropFromKill(x,y){
  if(Math.random()>0.35)return;
  const types=['rapid','triple','shield','bomb','life'];
  dropPowerup(x,y,types[Math.floor(Math.random()*types.length)]);
}
function spawnGuaranteedReward(){
  const types=['rapid','triple','shield','bomb','life'];
  const type=types[Math.floor(Math.random()*types.length)];
  const rx=Math.max(20,Math.min(W-20,P.x+(Math.random()*160-80)));
  dropPowerup(rx,P.y-50,type);
  rewardBannerTimer=100; rewardBurstTimer=20;
  burst(rx,P.y-50,POWERUP_DEFS[type].color,14);
}

const keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(state==='title'   &&(e.code==='Space'||e.code==='Enter')) startGame();
  if(state==='gameover'&&(e.code==='Space'||e.code==='Enter')) goToShop();

  if(state==='shop'    &&(e.code==='Escape')) state='title';
  if(state==='playing' &&(e.code==='KeyJ'||e.code==='ArrowUp')) shootPlayer();

});

// ── Mouse / Touch click for shop & title ──
function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top)  * (H / rect.height),
  };
}
function handleCanvasInteract(cx, cy) {
  if (state === 'title')    handleTitleClick(cx, cy);
  if (state === 'shop')     handleShopClick(cx, cy);
  if (state === 'gameover') handleGameOverClick(cx, cy);
}
function handleGameOverClick(mx, my) {
  // SHOP button area
  if (mx > W/2-120 && mx < W/2+120 && my > 312 && my < 372) goToShop();
  // PLAY AGAIN button area
  if (mx > W/2-80  && mx < W/2+80  && my > 385 && my < 425) startGame();
}
canvas.addEventListener('click', e => {
  const {x, y} = canvasCoords(e.clientX, e.clientY);
  handleCanvasInteract(x, y);
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  const {x, y} = canvasCoords(t.clientX, t.clientY);
  handleCanvasInteract(x, y);
}, {passive: false});

// ── On-screen button touch controls ──
function setupTouchControls() {
  const map = {
    'btn-left':  () => { keys['KeyA'] = true; },
    'btn-right': () => { keys['KeyD'] = true; },
    'btn-jump':  () => { keys['KeyW'] = true; },
    'btn-shoot': () => { keys['KeyJ'] = true; shootPlayer(); },
  };
  const unmap = {
    'btn-left':  () => { keys['KeyA'] = false; },
    'btn-right': () => { keys['KeyD'] = false; },
    'btn-jump':  () => { keys['KeyW'] = false; },
    'btn-shoot': () => { keys['KeyJ'] = false; },
  };
  Object.keys(map).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      el.classList.add('pressed');
      map[id]();
      // Jump fires once on tap
      if (id === 'btn-jump' && P && P.onGround) { P.vy = -12.5; P.onGround = false; }
    }, {passive: false});
    el.addEventListener('touchend', e => {
      e.preventDefault();
      el.classList.remove('pressed');
      unmap[id]();
    }, {passive: false});
    el.addEventListener('touchcancel', e => {
      el.classList.remove('pressed');
      unmap[id]();
    }, {passive: false});
  });
}
setupTouchControls();

// Show/hide controls based on state
function syncControlsVisibility() {
  const ctrl = document.getElementById('controls');
  if (!ctrl) return;
  const show = state === 'playing' && ('ontouchstart' in window);
  ctrl.style.display = show ? 'block' : 'none';
}

// ═══════════════════════════════════════════════
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function applyPlatformLanding(ent){
  ent.onGround=false;
  for(const pl of PLAT_LAYOUT){
    const prevB=ent.y+ent.h-ent.vy;
    if(ent.x+ent.w>pl.x&&ent.x<pl.x+pl.w&&ent.y+ent.h>=pl.y&&prevB<=pl.y+8&&ent.vy>=0){
      ent.y=pl.y-ent.h; ent.vy=0; ent.onGround=true;
    }
  }
}

//  PARTICLES
// ═══════════════════════════════════════════════
function burst(x,y,color,n){
  n=n||12;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*30,maxLife:70,color,r:Math.random()*3+1});
  }
}
function floatText(x,y,text,color){ floatingTexts.push({x,y,text,color,life:70,maxLife:70}); }

//  SPAWNER
// ═══════════════════════════════════════════════
let spawnTimer=0;
function spawnInterval(){ return Math.max(38,135-level*7); }
function maxOnScreen(){   return Math.min(3+Math.floor(level/2),10); }
function killTarget(){    return level; }

// ═══════════════════════════════════════════════
//  GAME FLOW
// ═══════════════════════════════════════════════
function startGame(){
  state='playing';
  syncControlsVisibility();
  score=0;level=1;kills=0;killsThisLevel=0;
  frame=0;spawnTimer=0;
  levelUpTimer=0;mapChangeBannerTimer=0;rewardBannerTimer=0;
  rewardTimer=0;rewardBurstTimer=0;
  gameOverCoinsEarned=0;
  currentThemeIdx=0;
  PLAT_LAYOUT=ALL_LAYOUTS[0].map(p=>({...p,isGround:!!p.isGround}));
  platLayoutIdx=0;platTransition=0;platOldLayout=platNewLayout=null;
  enemies=[];bullets=[];eBullets=[];powerups=[];particles=[];floatingTexts=[];
  P=makePlayer();
  rebuildStars();
}

function goToShop(){
  syncControlsVisibility();
  // Give end-of-run coins bonus from score
  const bonus=Math.floor(score/80);
  if(bonus>0){
    coins+=bonus;
    gameOverCoinsEarned+=bonus;
    saveAll();
  }
  state='shop';
  shopTab='chars'; // open on chars by default
}

function doLevelUp(){
  level++;killsThisLevel=0;levelUpTimer=150;
  if(level%2===0&&P.lives<9){ P.lives++; floatText(P.x+P.w/2,P.y-20,'+1 UP!','#ff4488'); }
  updateTheme();
}

function onKill(e){
  score+=e.pts; kills++; killsThisLevel++;
  // Coins per kill
  const c=Math.ceil(e.pts/8);
  coins+=c; gameOverCoinsEarned+=c;
  saveAll();
  floatText(e.x+e.w/2,e.y,'+'+e.pts,'#ffff88');
  floatText(e.x+e.w/2,e.y-18,'🪙+'+c,'#ffcc44');
  burst(e.x+e.w/2,e.y+e.h/2,e.col.body,16);
  maybeDropFromKill(e.x+e.w/2,e.y);
  while(killsThisLevel>=killTarget()){ killsThisLevel-=killTarget(); doLevelUp(); }
}

function hitPlayer(){
  if(P.invincible>0||P.dead)return;
  if(P.shield>0){ P.shield=0;P.invincible=60;floatText(P.x+P.w/2,P.y-20,'BLOCKED!','#44aaff');burst(P.x+P.w/2,P.y+P.h/2,'#44aaff',10);return; }
  P.lives--;
  burst(P.x+P.w/2,P.y+P.h/2,'#ff4444',12);
  if(P.lives<=0){ P.dead=true;P.deathTimer=90; }
  else P.invincible=110;
}

function collectPower(p){
  const t=p.type;const def=POWERUP_DEFS[t];
  burst(p.x,p.y,def.color,12);
  if(t==='life'){ if(P.lives<9)P.lives++; floatText(p.x,p.y,'+1 UP!',def.color); }
  else if(t==='bomb'){
    for(const e of enemies){score+=e.pts;kills++;killsThisLevel++;const c=Math.ceil(e.pts/8);coins+=c;gameOverCoinsEarned+=c;burst(e.x+e.w/2,e.y+e.h/2,e.col.body,18);floatText(e.x+e.w/2,e.y,'+'+e.pts,'#ffff88');}
    enemies=[];eBullets=[];floatText(p.x,p.y-20,'BOOM!',def.color);saveAll();
    while(killsThisLevel>=killTarget()){killsThisLevel-=killTarget();doLevelUp();}
  }
  else if(t==='shield'){ P.shield=300; floatText(p.x,p.y,'SHIELD!',def.color); }
  else { P.powerup=t;P.powerupTimer=420;floatText(p.x,p.y,def.label,def.color); }
}

// ═══════════════════════════════════════════════
//  UPDATE FUNCTIONS
// ═══════════════════════════════════════════════
function updatePlayer(){
  if(P.dead){P.deathTimer--;if(P.deathTimer<=0)goToShop();return;}
  if(keys['KeyA']||keys['ArrowLeft']){P.vx=-3.8;P.facing=-1;}
  else if(keys['KeyD']||keys['ArrowRight']){P.vx=3.8;P.facing=1;}
  else P.vx*=0.72;
  if((keys['KeyW']||keys['Space'])&&P.onGround){P.vy=-12.5;P.onGround=false;}
  P.vy=Math.min(P.vy+0.55,15);
  P.x+=P.vx;P.y+=P.vy;
  if(P.x<0)P.x=0;if(P.x+P.w>W)P.x=W-P.w;
  if(P.y>H+60){hitPlayer();P.x=290;P.y=395;P.vy=0;}
  applyPlatformLanding(P);
  if(P.shootCD>0)P.shootCD--;
  if(P.invincible>0)P.invincible--;
  if(P.shield>0)P.shield--;
  if(P.powerupTimer>0){P.powerupTimer--;if(!P.powerupTimer)P.powerup=null;}
  if(keys['KeyJ']||keys['KeyS'])shootPlayer();
  if(Math.abs(P.vx)>0.5&&P.onGround){P.walkTimer++;if(P.walkTimer>7){P.walkTimer=0;P.walkFrame^=1;}}else P.walkFrame=0;
}

function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.phase+=0.04;e.y=e.baseY+Math.sin(e.phase)*7;e.x+=e.vx;
    if(e.x<-60||e.x>W+60){e.vx*=-1;e.baseY=e.y;}
    if(!P.dead){
      e.sTimer++;
      if(e.sTimer>=e.sRate){
        e.sTimer=0;
        const dx=(P.x+P.w/2)-(e.x+e.w/2),dy=(P.y+P.h/2)-(e.y+e.h/2);
        const d=Math.sqrt(dx*dx+dy*dy)||1,spd=3.2+level*0.18;
        eBullets.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(dx/d)*spd,vy:(dy/d)*spd,w:9,h:9});
      }
      if(P.invincible===0&&overlap(e,P))hitPlayer();
    }
    if(e.hitFlash>0)e.hitFlash--;
    e.walkTimer=(e.walkTimer||0)+1;if(e.walkTimer>8){e.walkTimer=0;e.walkFrame=(e.walkFrame||0)^1;}
  }
}

function updateBullets(){
  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)return false;
    for(let i=enemies.length-1;i>=0;i--){
      if(overlap(b,enemies[i])){
        if(b.explode){
          // Rocket AOE
          for(let j=enemies.length-1;j>=0;j--){
            if(Math.hypot(enemies[j].x-b.x,enemies[j].y-b.y)<70){
              enemies[j].hp--;enemies[j].hitFlash=8;
              if(enemies[j].hp<=0){onKill(enemies[j]);enemies.splice(j,1);}
            }
          }
          burst(b.x,b.y,'#ff6600',20);
          return false;
        }
        enemies[i].hp--;enemies[i].hitFlash=8;
        burst(b.x,b.y,enemies[i].col.body,5);
        if(enemies[i].hp<=0){onKill(enemies[i]);enemies.splice(i,1);}
        return b.pierce; // piercing bullets continue
      }
    }
    return true;
  });
  eBullets=eBullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)return false;
    if(!P.dead&&overlap(b,P)){hitPlayer();burst(b.x,b.y,'#ff4444',6);return false;}
    return true;
  });
}

function updatePowerups(){
  powerups=powerups.filter(p=>{
    if(!p.landed){
      p.vy+=0.55;p.y+=p.vy;
      for(const pl of PLAT_LAYOUT){
        const prevB=p.y+8-p.vy;
        if(p.x+8>pl.x&&p.x-8<pl.x+pl.w&&p.y+8>=pl.y&&prevB<=pl.y+8&&p.vy>=0){
          p.y=pl.y-8;p.vy=0;p.landed=true;break;
        }
      }
      if(p.y>H+60)return false;
    }
    p.bob+=0.08;p.life--;
    if(p.life<=0)return false;
    if(!P.dead&&overlap({x:p.x-12,y:p.y-12,w:24,h:24},P)){collectPower(p);return false;}
    return true;
  });
}

function updateParticles(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});
  floatingTexts=floatingTexts.filter(t=>{t.y-=0.8;t.life--;return t.life>0;});
}

function updateSpawner(){ spawnTimer++;if(spawnTimer>=spawnInterval()&&enemies.length<maxOnScreen()){spawnTimer=0;spawnEnemy();} }
function updateRewardTimer(){
  if(P.dead)return;
  rewardTimer++;if(rewardTimer>=600){rewardTimer=0;spawnGuaranteedReward();}
  if(rewardBurstTimer>0)rewardBurstTimer--;
}

// ═══════════════════════════════════════════════
//  DRAWING HELPERS
// ═══════════════════════════════════════════════
function roundRect(x,y,w,h,r,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.stroke();}
}

function drawRobloxChar(ox,oy,shirt,pants,headC,hatC,facing,walkFrame,scale,flash){
  scale=scale||1;flash=flash||false;
  ctx.save();
  ctx.translate(ox+(facing>0?0:24*scale),oy);ctx.scale(facing*scale,scale);
  const s=c=>flash?'#ffffff':c;
  // Head
  roundRect(3,0,18,18,3,s(headC),'#00000044');
  ctx.fillStyle=flash?'#fff':'#333';ctx.fillRect(6,5,4,4);ctx.fillRect(14,5,4,4);
  ctx.fillStyle=flash?'#fff':'#111';ctx.fillRect(7,6,2,2);ctx.fillRect(15,6,2,2);
  ctx.strokeStyle=flash?'#fff':'#555';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(12,13,3,0.2,Math.PI-0.2);ctx.stroke();
  // Hat
  ctx.fillStyle=s(hatC||shirt);ctx.fillRect(2,-7,20,7);ctx.fillRect(5,-10,14,4);
  // Torso
  roundRect(2,18,20,18,2,s(shirt),'#00000033');
  // Arms
  const sw=walkFrame?3:-3;
  roundRect(-4,18+sw,7,16,2,s(shirt),'#00000033');
  roundRect(21,18-sw,7,16,2,s(shirt),'#00000033');
  // Legs
  const lL=walkFrame?5:0,lR=walkFrame?0:5;
  roundRect(3,36,8,14+lL,2,s(pants),'#00000033');
  roundRect(13,36,8,14+lR,2,s(pants),'#00000033');
  roundRect(3,50+lL,8,5,1,s('#001a66'),'');
  roundRect(13,50+lR,8,5,1,s('#001a66'),'');
  // Gun
  roundRect(22,24,12,6,2,flash?'#fff':'#888','');
  ctx.fillStyle=flash?'#fff':'#aaa';ctx.fillRect(31,24,5,4);
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  DRAW SCENE
// ═══════════════════════════════════════════════
function drawBackground(){
  const th=getTheme();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky0);g.addColorStop(1,th.sky1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.blink+=s.speed;const a=0.3+Math.sin(s.blink)*0.28;
    ctx.globalAlpha=a;ctx.fillStyle=th.starC;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOnePlatform(pl,th,offY){
  offY=offY||0;
  const c=pl.isGround?th.groundC:th.platC,t=pl.isGround?th.groundT:th.platT,y=pl.y+offY;
  ctx.fillStyle='#00000044';ctx.fillRect(pl.x+4,y+4,pl.w,pl.h+4);
  ctx.fillStyle=c;ctx.fillRect(pl.x,y,pl.w,pl.h+4);
  ctx.fillStyle=t;ctx.fillRect(pl.x,y,pl.w,3);
  ctx.fillStyle='#00000020';
  for(let bx=pl.x;bx<pl.x+pl.w;bx+=20)ctx.fillRect(bx,y,1,pl.h+4);
  ctx.shadowColor=t;ctx.shadowBlur=8;ctx.fillStyle=t;
  for(let bx=pl.x+10;bx<pl.x+pl.w-5;bx+=20)roundRect(bx-4,y-5,8,5,2,t,'');
  ctx.shadowBlur=0;
}

function drawPlatforms(){
  const th=getTheme();
  if(!platTransition){for(const pl of PLAT_LAYOUT)drawOnePlatform(pl,th,0);return;}
  if(platTransition<=30){
    const t=platTransition/30,offY=Math.round(t*(H+60));
    ctx.globalAlpha=1-t*0.6;
    for(const pl of (platOldLayout||PLAT_LAYOUT))drawOnePlatform(pl,th,offY);
    ctx.globalAlpha=1;
  } else {
    const t=(platTransition-30)/30,offY=Math.round((1-t)*(-(H+60)));
    ctx.globalAlpha=t;
    for(const pl of PLAT_LAYOUT)drawOnePlatform(pl,th,offY);
    ctx.globalAlpha=1;
  }
}

function drawPlayer(){
  if(P.dead)return;
  if(P.invincible>0&&Math.floor(P.invincible/5)%2===0)return;
  if(P.shield>0){
    ctx.shadowColor='#44aaff';ctx.shadowBlur=20+Math.sin(frame*0.15)*8;
    ctx.strokeStyle='#44aaff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(P.x+P.w/2,P.y+P.h/2,26,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }
  const ch=CHARS[selChar]||CHARS.noob;
  drawRobloxChar(Math.round(P.x),Math.round(P.y),getShirtColor(),P.pants,P.head,ch.hat,P.facing,P.walkFrame);
}

function drawEnemies(){
  for(const e of enemies){
    const flash=e.hitFlash>0;
    ctx.shadowColor=e.col.body;ctx.shadowBlur=flash?28:8;
    drawRobloxChar(Math.round(e.x),Math.round(e.y),e.col.body,e.col.dark,e.col.head,null,e.vx>0?1:-1,e.walkFrame||0,1,flash);
    if(e.maxHp>1){
      ctx.shadowBlur=0;ctx.fillStyle='#333';ctx.fillRect(e.x,e.y-10,e.w,5);
      ctx.fillStyle=e.hp===e.maxHp?'#44ff44':e.hp===1?'#ff4444':'#ffaa00';
      ctx.fillRect(e.x,e.y-10,e.w*(e.hp/e.maxHp),5);
    }
    ctx.shadowBlur=0;
  }
}

function drawBullets(){
  for(const b of bullets){
    const col=b.col||'#00ff88';
    ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;
    if(b.gun==='rocket'){
      // Rocket shape
      ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
    } else if(b.gun==='sniper'){
      // Long thin beam
      ctx.fillRect(b.x-(b.vx>0?0:20),b.y-2,22,4);
    } else {
      ctx.fillRect(b.x,b.y-b.h/2,b.w,b.h);
      ctx.beginPath();ctx.arc(b.x+(b.vx>0?b.w:0),b.y,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.shadowColor='#ff3300';ctx.shadowBlur=12;
  for(const b of eBullets){
    ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff9900';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawPowerups(){
  for(const p of powerups){
    const def=POWERUP_DEFS[p.type];
    const bob=p.landed?Math.sin(p.bob)*3:0,py=p.y+bob;
    const alpha=p.life<120?p.life/120:1;
    ctx.globalAlpha=alpha;ctx.shadowColor=def.color;ctx.shadowBlur=18;
    roundRect(p.x-13,py-13,26,26,6,def.bg,def.color,2);
    ctx.fillStyle=def.color;ctx.font='15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.icon,p.x,py);
    if(p.landed){
      const pct=p.life/600;
      ctx.strokeStyle=def.color+'66';ctx.lineWidth=2;ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(p.x,py,17,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function drawFloatingTexts(){
  for(const t of floatingTexts){
    ctx.globalAlpha=t.life/t.maxLife;ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=8;
    ctx.font='bold 13px Arial Black';ctx.textAlign='center';
    ctx.fillText(t.text,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.textAlign='left';
}

// ═══════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════
function drawHUD(){
  const th=getTheme();
  ctx.fillStyle='#000000bb';ctx.fillRect(0,0,W,48);
  // Level badge
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=12;
  roundRect(8,6,82,30,6,'#1a1600','#ffcc00',2);
  ctx.fillStyle='#ffcc00';ctx.font='bold 15px Arial Black';ctx.textAlign='center';
  ctx.fillText('LVL '+level,49,27);ctx.shadowBlur=0;
  // Theme
  ctx.fillStyle=th.ambientC+'bb';ctx.font='10px Arial';ctx.textAlign='left';
  ctx.fillText(th.name,96,24);
  // Score
  ctx.fillStyle='#ffffff';ctx.font='bold 14px Arial Black';ctx.textAlign='center';
  ctx.fillText(score+' pts',W/2,24);
  // Coins
  ctx.fillStyle='#ffcc44';ctx.font='bold 13px Arial Black';
  ctx.fillText('🪙 '+coins,W/2,40);
  // Kill bar
  const kt=killTarget(),pct=Math.min(killsThisLevel/kt,1),bw=120,bx=W/2+50;
  roundRect(bx,34,bw,7,4,'#222','');
  ctx.fillStyle=th.ambientC;ctx.shadowColor=th.ambientC;ctx.shadowBlur=8;
  if(pct>0)roundRect(bx,34,bw*pct,7,4,th.ambientC,'');
  ctx.shadowBlur=0;ctx.fillStyle='#aaa';ctx.font='9px Arial';ctx.textAlign='left';
  ctx.fillText(killsThisLevel+'/'+kt+' kills',bx,47);
  // Lives
  ctx.textAlign='right';
  for(let i=0;i<Math.max(0,P.lives);i++){
    const hx=W-10-i*21;ctx.font='17px Arial';
    ctx.fillStyle=i<3?'#ff4466':'#ffaa00';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;
    ctx.fillText('♥',hx,27);
  }
  ctx.shadowBlur=0;
  // Powerup bar
  if(P.powerup){
    const c=P.powerup==='rapid'?'#ffff00':'#00ffff',pup=P.powerupTimer/420;
    roundRect(W-118,32,106,8,4,'#222','');
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;
    roundRect(W-118,32,106*pup,8,4,c,'');
    ctx.shadowBlur=0;ctx.fillStyle=c;ctx.font='9px Arial';ctx.textAlign='right';
    ctx.fillText(P.powerup==='rapid'?'⚡ RAPID':'✦ TRIPLE',W-8,46);
  }
  if(P.shield>0){
    const c='#44aaff',pup=P.shield/300,by2=P.powerup?44:32;
    roundRect(W-118,by2,106,8,4,'#222','');
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8;
    roundRect(W-118,by2,106*pup,8,4,c,'');
    ctx.shadowBlur=0;ctx.fillStyle=c;ctx.font='9px Arial';ctx.textAlign='right';
    ctx.fillText('🛡 SHIELD',W-8,by2+14);
  }
  // Reward ring
  const rx=W-30,ry=H-30,rad=18,tPct=rewardTimer/600,glowing=rewardTimer>500;
  ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.arc(rx,ry,rad,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=glowing?(Math.floor(frame/6)%2?'#ffff00':'#ff8800'):'#00ff88';
  ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=glowing?18:8;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(rx,ry,rad,-Math.PI/2,-Math.PI/2+tPct*Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=glowing?'#ffff00':'#aaa';ctx.font='12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🎁',rx,ry);ctx.textBaseline='alphabetic';ctx.textAlign='left';

  // Banners
  if(rewardBannerTimer>0){
    rewardBannerTimer--;const a=Math.min(1,rewardBannerTimer/20);
    ctx.globalAlpha=a;ctx.font='bold 22px Arial Black';ctx.textAlign='center';
    ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=25;
    ctx.fillText('🎁 BONUS REWARD!',W/2,H/2+80);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';
  }
  if(levelUpTimer>0){
    levelUpTimer--;const a=levelUpTimer>110?1:levelUpTimer/110;
    ctx.globalAlpha=a;ctx.font='bold 54px Arial Black';ctx.textAlign='center';
    ctx.fillStyle='#000';ctx.fillText('LEVEL '+level+'!',W/2+3,H/2+3);
    const lg=ctx.createLinearGradient(0,H/2-50,0,H/2+10);lg.addColorStop(0,'#ffff00');lg.addColorStop(1,'#ff8800');
    ctx.fillStyle=lg;ctx.shadowColor='#ffcc00';ctx.shadowBlur=40;ctx.fillText('LEVEL '+level+'!',W/2,H/2);
    ctx.font='bold 18px Arial Black';ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=15;
    ctx.fillText('Need '+level+' kills next!',W/2,H/2+40);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';
  }
  if(mapChangeBannerTimer>0){
    mapChangeBannerTimer--;const a=mapChangeBannerTimer>120?1:mapChangeBannerTimer/120;
    ctx.globalAlpha=a;ctx.font='bold 20px Arial Black';ctx.textAlign='center';
    ctx.fillStyle=th.ambientC;ctx.shadowColor=th.ambientC;ctx.shadowBlur=25;
    ctx.fillText('🗺 MAP: '+th.name,W/2,H/2+72);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign='left';
  }
}

// ═══════════════════════════════════════════════

function handleTitleClick(mx,my){

}

// ═══════════════════════════════════════════════
//  SHOP SCREEN
// ═══════════════════════════════════════════════
let shopTab = 'chars'; // 'chars' | 'guns' | 'outfit'
const SHOP_CHAR_ORDER = ['noob','warrior','ninja','robot','golden','ghost'];
const SHOP_GUN_ORDER  = ['pistol','smg','shotgun','sniper','rocket'];

// Stores clickable zones for the shop
let shopZones = [];

function handleShopClick(mx,my){
  for(const z of shopZones){
    if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
      z.action();
      return;
    }
  }
}

function shopBtn(label,x,y,w,h,fill,textCol,action){
  shopZones.push({x,y,w,h,action});
  roundRect(x,y,w,h,6,fill,'#ffffff22',1);
  ctx.fillStyle=textCol||'#fff';ctx.font='bold 12px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+h/2);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function drawShop(){
  // Dark bg
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0a18');g.addColorStop(1,'#12122a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  shopZones=[];

  // Header
  ctx.fillStyle='#000000cc';ctx.fillRect(0,0,W,46);
  ctx.fillStyle='#ffcc00';ctx.font='bold 18px Arial Black';ctx.textAlign='center';
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=12;ctx.fillText('🏪 SHOP',W/2,30);ctx.shadowBlur=0;
  ctx.fillStyle='#ffcc44';ctx.font='bold 15px Arial Black';ctx.textAlign='left';
  ctx.fillText('🪙 '+coins,10,30);
  // Back button
  shopBtn('✕ BACK',W-80,8,70,30,'#330000','#ff6666',()=>{ state='title'; });

  // Tabs
  const tabs=[['🧑 CHARS','chars'],['🔫 GUNS','guns'],['👕 OUTFIT','outfit']];
  tabs.forEach(([lbl,id],i)=>{
    const tx=10+i*140,ty=48,tw=132,th2=30;
    const active=shopTab===id;
    shopZones.push({x:tx,y:ty,w:tw,h:th2,action:()=>{ shopTab=id; }});
    roundRect(tx,ty,tw,th2,6,active?'#223366':'#111','#00b4d8'+(active?'ff':'55'),active?2:1);
    ctx.fillStyle=active?'#fff':'#778';ctx.font='bold 13px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(lbl,tx+tw/2,ty+th2/2);ctx.textAlign='left';ctx.textBaseline='alphabetic';
  });

  const contentY=86;

  if(shopTab==='chars') drawShopChars(contentY);
  if(shopTab==='guns')  drawShopGuns(contentY);
  if(shopTab==='outfit')drawShopOutfit(contentY);
}

function drawShopChars(startY){
  const cols=3,cardW=188,cardH=168,padX=8,padY=6;
  SHOP_CHAR_ORDER.forEach((id,i)=>{
    const ch=CHARS[id];
    const col=i%cols,row=Math.floor(i/cols);
    const cx=padX+col*(cardW+padX),cy=startY+row*(cardH+padY);
    const owned=unlocks.includes(id),selected=selChar===id;

    const borderCol=selected?'#ffcc00':owned?'#44ff88':'#444';
    const bgCol=selected?'#1a1500':owned?'#001a00':'#0d0d1a';
    roundRect(cx,cy,cardW,cardH,8,bgCol,borderCol,selected?2.5:1.5);
    if(selected){
      ctx.shadowColor='#ffcc00';ctx.shadowBlur=15;
      roundRect(cx,cy,cardW,cardH,8,'','#ffcc00',2.5);ctx.shadowBlur=0;
    }

    // Character preview
    drawRobloxChar(cx+cardW/2-20,cy+12,selShirt,selPants,ch.head,ch.hat,1,Math.floor(frame/20)%2,1.1);

    // Name
    ctx.fillStyle=selected?'#ffcc00':owned?'#fff':'#888';
    ctx.font='bold 13px Arial Black';ctx.textAlign='center';
    ctx.fillText(ch.name,cx+cardW/2,cy+cardH-66);
    // Desc
    ctx.fillStyle='#666';ctx.font='10px Arial';
    ctx.fillText(ch.desc,cx+cardW/2,cy+cardH-51);

    if(selected){
      roundRect(cx+8,cy+cardH-42,cardW-16,28,6,'#443300','#ffcc00',1.5);
      ctx.fillStyle='#ffcc00';ctx.font='bold 12px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✓ SELECTED',cx+cardW/2,cy+cardH-28);ctx.textBaseline='alphabetic';
    } else if(owned){
      shopBtn('SELECT',cx+8,cy+cardH-42,cardW-16,28,'#003300','#44ff88',()=>{
        selChar=id;saveAll();P=makePlayer();
      });
    } else {
      shopBtn('🪙 '+ch.cost,cx+8,cy+cardH-42,cardW-16,28,coins>=ch.cost?'#1a0033':'#111',coins>=ch.cost?'#cc88ff':'#444',()=>{
        if(coins>=ch.cost&&!unlocks.includes(id)){coins-=ch.cost;unlocks.push(id);selChar=id;saveAll();P=makePlayer();}
      });
    }
    ctx.textAlign='left';
  });
}

function drawShopGuns(startY){
  const cols=1,cardW=600,cardH=66,padY=6;
  SHOP_GUN_ORDER.forEach((id,i)=>{
    const gd=GUNS[id];
    const cy=startY+i*(cardH+padY);
    const owned=unlocks.includes(id),selected=selGun===id;

    const borderCol=selected?'#ffcc00':owned?'#44ff88':'#444';
    const bgCol=selected?'#1a1500':owned?'#001a00':'#0d0d1a';
    roundRect(10,cy,cardW,cardH,8,bgCol,borderCol,selected?2.5:1.5);
    if(selected){ctx.shadowColor='#ffcc00';ctx.shadowBlur=12;roundRect(10,cy,cardW,cardH,8,'','#ffcc00',2.5);ctx.shadowBlur=0;}

    // Gun color dot
    ctx.shadowColor=gd.color;ctx.shadowBlur=10;
    ctx.fillStyle=gd.color;ctx.beginPath();ctx.arc(36,cy+33,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

    // Name
    ctx.fillStyle=selected?'#ffcc00':owned?'#fff':'#888';
    ctx.font='bold 14px Arial Black';ctx.textAlign='left';
    ctx.fillText(gd.name,58,cy+22);
    // Desc
    ctx.fillStyle='#666';ctx.font='11px Arial';ctx.fillText(gd.desc,58,cy+38);
    // Stats
    ctx.fillStyle='#aaa';ctx.font='10px Arial';
    ctx.fillText('CD:'+gd.cd+'f  Bullets:'+gd.count+'  Speed:'+gd.spd+(gd.pierce?' PIERCE':'')+(gd.explode?' EXPLODE':''),58,cy+54);

    // Button
    if(selected){
      roundRect(460,cy+12,140,34,6,'#443300','#ffcc00',1.5);
      ctx.fillStyle='#ffcc00';ctx.font='bold 12px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('✓ SELECTED',530,cy+29);ctx.textBaseline='alphabetic';
    } else if(owned){
      shopBtn('SELECT',460,cy+12,140,34,'#003300','#44ff88',()=>{selGun=id;saveAll();if(P)P.gunType=id;});
    } else {
      shopBtn('🪙 '+gd.cost,460,cy+12,140,34,coins>=gd.cost?'#1a0033':'#111',coins>=gd.cost?'#cc88ff':'#444',()=>{
        if(coins>=gd.cost&&!unlocks.includes(id)){coins-=gd.cost;unlocks.push(id);selGun=id;saveAll();if(P)P.gunType=id;}
      });
    }
    ctx.textAlign='left';
  });
}

function drawShopOutfit(startY){
  // Live preview character (left side)
  const ch=CHARS[selChar]||CHARS.noob;
  ctx.fillStyle='#111122';
  roundRect(10,startY,200,H-startY-10,8,'#111122','#333',1);
  ctx.fillStyle='#888';ctx.font='11px Arial';ctx.textAlign='center';
  ctx.fillText('PREVIEW',110,startY+20);
  drawRobloxChar(74,startY+28,selShirt,selPants,ch.head,ch.hat,1,Math.floor(frame/20)%2,1.8);
  ctx.fillStyle='#666';ctx.font='10px Arial';
  ctx.fillText(CHARS[selChar].name,110,startY+175);
  ctx.fillText(GUNS[selGun].name+' equipped',110,startY+190);
  ctx.textAlign='left';

  // Color pickers (right side)
  const rx=220,sw=32,sg=6,cols2=6;

  ctx.fillStyle='#ffcc44';ctx.font='bold 13px Arial Black';
  ctx.fillText('👕 Shirt Color',rx,startY+20);
  PALETTE.forEach((c,i)=>{
    const col=i%cols2,row=Math.floor(i/cols2);
    const sx=rx+col*(sw+sg),sy=startY+28+row*(sw+sg);
    shopZones.push({x:sx,y:sy,w:sw,h:sw,action:()=>{selShirt=c;saveAll();if(P)P.shirt=c;}});
    ctx.shadowColor=c;ctx.shadowBlur=selShirt===c?12:0;
    roundRect(sx,sy,sw,sw,4,c,selShirt===c?'#ffffff':'#333',selShirt===c?2.5:1);
    ctx.shadowBlur=0;
    if(selShirt===c){ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',sx+sw/2,sy+sw/2);ctx.textBaseline='alphabetic';ctx.textAlign='left';}
  });

  ctx.fillStyle='#ffcc44';ctx.font='bold 13px Arial Black';
  ctx.fillText('👖 Pants Color',rx,startY+130);
  PALETTE.forEach((c,i)=>{
    const col=i%cols2,row=Math.floor(i/cols2);
    const sx=rx+col*(sw+sg),sy=startY+138+row*(sw+sg);
    shopZones.push({x:sx,y:sy,w:sw,h:sw,action:()=>{selPants=c;saveAll();if(P)P.pants=c;}});
    ctx.shadowColor=c;ctx.shadowBlur=selPants===c?12:0;
    roundRect(sx,sy,sw,sw,4,c,selPants===c?'#ffffff':'#333',selPants===c?2.5:1);
    ctx.shadowBlur=0;
    if(selPants===c){ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓',sx+sw/2,sy+sw/2);ctx.textBaseline='alphabetic';ctx.textAlign='left';}
  });

  // Reset button
  shopBtn('RESET OUTFIT',rx,startY+242,180,28,'#1a0000','#ff6666',()=>{
    selShirt='#e82020';selPants='#00329e';saveAll();if(P){P.shirt=selShirt;P.pants=selPants;}
  });
}

// ═══════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════
function loop(){
  ctx.clearRect(0,0,W,H);
  frame++;

  if(state==='title'){
    drawTitle();
  } else if(state==='shop'){
    drawShop();
  } else if(state==='gameover'){
    drawBackground();
    drawGameOver();
  } else {
    updatePlayer();updateEnemies();updateBullets();
    updatePowerups();updateParticles();updateSpawner();
    updateRewardTimer();updatePlatTransition();

    drawBackground();drawPlatforms();drawParticles();
    drawPowerups();drawEnemies();drawBullets();drawPlayer();
    drawFloatingTexts();drawHUD();
  }
  requestAnimationFrame(loop);
}
loop();
</script>
