<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <script src="/pz-core.js"></script>
  <script src="/pz-ui.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      font-family: 'Arial Black','Arial',sans-serif;
    }
    #wrapper {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    #gameCanvas {
      display:block;
      image-rendering:pixelated;
      image-rendering:crisp-edges;
      cursor:pointer;
      /* border + glow applied via JS after resize */
      box-shadow:0 0 30px #00b4d855;
      max-width:100%;
      max-height:100%;
    }
    /* ── TOUCH CONTROLS ── */
    #controls {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ── JOYSTICK (left side) ── */
    #joystick-zone {
      position: absolute;
      left: 0; top: 0;
      width: 50%; height: 100%;
      pointer-events: auto;
    }
    #joystick-base {
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(0,180,216,0.12);
      border: 2.5px solid rgba(0,180,216,0.35);
      display: none;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #joystick-knob {
      position: absolute;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: rgba(0,180,216,0.7);
      border: 2px solid #00b4d8;
      box-shadow: 0 0 14px #00b4d8aa;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: box-shadow 0.1s;
    }

    /* ── JUMP BUTTON (right side) ── */
    #btn-jump {
      position: absolute;
      right: 28px;
      bottom: 36px;
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(0,255,136,0.18);
      border: 3px solid rgba(0,255,136,0.6);
      color: #00ff88;
      font-size: 38px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s, transform 0.08s;
      box-shadow: 0 0 18px rgba(0,255,136,0.25);
    }
    #btn-jump.pressed {
      background: rgba(0,255,136,0.45);
      transform: scale(0.88);
      box-shadow: 0 0 28px rgba(0,255,136,0.6);
    }

    /* ── AUTO-SHOOT INDICATOR ── */
    #autoshoot-badge {
      position: absolute;
      right: 28px;
      bottom: 148px;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,136,0.7);
      font-family: 'Arial Black', Arial, sans-serif;
      letter-spacing: 1px;
      pointer-events: none;
      text-align: center;
      width: 96px;
    }

    /* ── TUTORIAL OVERLAY ── */
    #touch-tutorial {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      display: none;
      animation: tutFadeOut 0.5s ease 3.5s forwards;
    }
    @keyframes tutFadeOut {
      to { opacity: 0; }
    }
    /* left hint */
    .tut-left {
      position: absolute;
      left: 0; top: 0;
      width: 50%; height: 100%;
      border: 2.5px dashed rgba(0,180,216,0.4);
      border-radius: 0 12px 12px 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
    }
    .tut-left .tut-icon { font-size: 36px; }
    .tut-left .tut-label {
      font-size: 13px; font-weight: 900;
      color: rgba(0,200,255,0.85);
      font-family: 'Arial Black', Arial, sans-serif;
      letter-spacing: 1px;
    }
    /* right hint */
    .tut-right {
      position: absolute;
      right: 0; top: 0;
      width: 50%; height: 100%;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 55px;
      flex-direction: column;
      align-items: center;
    }
    .tut-right .tut-icon { font-size: 36px; }
    .tut-right .tut-label {
      font-size: 13px; font-weight: 900;
      color: rgba(0,255,136,0.85);
      font-family: 'Arial Black', Arial, sans-serif;
      letter-spacing: 1px;

      position: absolute;
      bottom: 160px; right: 10px;
      font-size: 11px; font-weight: 700;
      color: rgba(255,220,80,0.85);
      font-family: 'Arial Black', Arial, sans-serif;
      text-align: center; width: 116px;
      letter-spacing: 1px;
    }

    /* ── PORTRAIT WARNING ── */
    #portrait-warn {
      display:none;
      position:fixed; inset:0;
      background:#000;
      color:#fff;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:20px;
      z-index:9999;
      text-align:center;
      padding:40px;
    }
    #portrait-warn .pw-title {
      font-size:24px;
      font-weight:900;
      font-family:'Arial Black',Arial,sans-serif;
      letter-spacing:1px;
    }
    #portrait-warn .pw-sub {
      font-size:14px;
      color:#888;
      font-family:Arial,sans-serif;
    }
    /* آیکون چرخان با انیمیشن */
    #portrait-warn .pw-phone {
      font-size:72px;
      animation: rotate-hint 1.4s ease-in-out infinite;
      display:inline-block;
      transform-origin:center;
    }
    @keyframes rotate-hint {
      0%   { transform:rotate(0deg);   }
      30%  { transform:rotate(-90deg); }
      60%  { transform:rotate(-90deg); }
      90%  { transform:rotate(0deg);   }
      100% { transform:rotate(0deg);   }
    }
    /* نوار پایین با gradient */
    #portrait-warn .pw-bar {
      width:60px; height:4px;
      border-radius:2px;
      background:linear-gradient(90deg,#00b4d8,#00ff88);
      margin-top:4px;
    }
    @media (orientation:portrait) {
      #portrait-warn { display:flex; }
    }
    /* Hide bottom bar on mobile */
    #bottomBar { display:none; }
  </style>
</head>

// لود config از Supabase اگه ?g=slug توی URL بود
async function loadGameConfig() {
  const params = new URLSearchParams(location.search);
  const slug   = params.get('g');
  if (!slug) return; // بازی پیش‌فرض

  const { data, error } = await sb.from('game_configs').select('*').eq('slug', slug).single();
  if (error || !data) { console.warn('Config not found:', slug); return; }

  GAME_CFG = { ...GAME_CFG, ...data };
  document.title = data.game_title + ' — BulletHead';

  // آپدیت اسم اسلحه‌ها
  if (data.gun_names) {
    if (GUNS.pistol)  GUNS.pistol.name  = data.gun_names.pistol  || GUNS.pistol.name;

    if (GUNS.rocket)  GUNS.rocket.name  = data.gun_names.rocket  || GUNS.rocket.name;

  // افزایش play_count

}

let leaderboardData = [];

async function saveScore(score, wave) {
  if (!GAME_CFG.slug || !playerName) return;
  await sb.from('scores').insert({
    game_slug:   GAME_CFG.slug,
    player_name: playerName,
    score,
    wave,
  });
}

async function loadLeaderboard() {
  if (!GAME_CFG.slug) return;
  // Fetch more rows so we can deduplicate — keep only best score per player
  const { data } = await sb.from('scores')
    .select('player_name, score, wave')
    .eq('game_slug', GAME_CFG.slug)
    .order('score', { ascending: false })
    .limit(100);
  // Deduplicate: one entry per player, highest score wins
  const best = new Map();
  for (const row of (data || [])) {
    const prev = best.get(row.player_name);
    if (!prev || row.score > prev.score) best.set(row.player_name, row);
  }
  leaderboardData = [...best.values()]
    .sort((a, b) => b.score - a.score)
    .slice(0, 10);
}

  try { const v = localStorage.getItem('bh_' + k); return v === null ? def : JSON.parse(v); }

function lsSet(k, v) {
  try { localStorage.setItem('bh_' + k, JSON.stringify(v)); } catch {}

let bullets=[],eBullets=[];

function shootPlayer(){
  if(P.dead||P.shootCD>0)return;
  const gd = GUNS[P.gunType]||GUNS.pistol;
  // Rapid powerup overrides cooldown
  const cd = P.powerup==='rapid' ? Math.floor(gd.cd*0.4) : gd.cd;
  const bx = P.x+(P.facing>0?P.w+2:-14);
  const by = P.y+12;
  const spd = gd.spd;
  const col = gd.color;

  if(P.powerup==='triple'){
    // Triple powerup: always 3 bullets regardless of gun
    for(let i=-1;i<=1;i++){
      bullets.push({x:bx,y:by,vx:P.facing*(spd-Math.abs(i)),vy:i*2.2,w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  } else {
    for(let i=0;i<gd.count;i++){
      const angle = gd.spread>0 ? (Math.random()-0.5)*gd.spread*2 : 0;
      const spread = gd.spread>0 ? (i/(gd.count-1||1)-0.5)*gd.spread*2 : 0;
      bullets.push({x:bx,y:by,vx:P.facing*spd*Math.cos(spread),vy:spd*Math.sin(spread),w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  }
  P.shootCD=cd;
}

function spawnBoss(){
  const hp      = level * 18;
  const skinIdx = Math.floor(Math.random() * BOSS_SKINS.length);
  boss = {
    x: W/2 - 36, y: -120,

    smokeTimer: 0,
    skin: BOSS_SKINS[skinIdx],
    // movement AI
    jumpCooldown: 0,
    chaseTimer: 0,
  };

function updateBoss(){
  if(!boss) return;

  // ── entry: سقوط از بالا ──
  if(!boss.landed){
    boss.vy += 0.7;
    boss.y  += boss.vy;
    boss.x  += boss.vx;
    if(boss.x < 20)          { boss.vx =  Math.abs(boss.vx); }
    if(boss.x+boss.w > W-20) { boss.vx = -Math.abs(boss.vx); }
    // زمین یا platform
    for(const pl of PLAT_LAYOUT){
      const prevB = boss.y + boss.h - boss.vy;
      if(boss.x+boss.w > pl.x && boss.x < pl.x+pl.w &&
         boss.y+boss.h >= pl.y && prevB <= pl.y+10 && boss.vy >= 0){
        boss.y = pl.y - boss.h;
        boss.vy = 0;
        boss.onGround = true;
        boss.landed = true;
        bossFlashTimer = 18; bossShakeTimer = 22;
        burst(boss.x+boss.w/2, boss.y+boss.h, boss.skin.glow, 30);
      }
    }
    if(!boss.landed && boss.y > H+50) { boss.y=-120; boss.vy=0; } // retry اگه miss کرد
    return;
  }

  // enrage check
  const rage = boss.hp / boss.maxHp < 0.5;
  if(rage && !boss.enraged){
    boss.enraged = true;
    floatText(boss.x+boss.w/2, boss.y-20, '😡 ENRAGED!', boss.skin.glow);
    burst(boss.x+boss.w/2, boss.y+boss.h/2, boss.skin.glow, 25);
  }

  const spd = boss.enraged ? 2.4 : 1.6;

  // ── GRAVITY ──
  boss.vy += 0.55;
  boss.y  += boss.vy;
  boss.onGround = false;

  // ── PLATFORM COLLISION ──
  for(const pl of PLAT_LAYOUT){
    const prevB = boss.y + boss.h - boss.vy;
    if(boss.x+boss.w > pl.x && boss.x < pl.x+pl.w &&
       boss.y+boss.h >= pl.y && prevB <= pl.y+10 && boss.vy >= 0){
      boss.y = pl.y - boss.h;
      boss.vy = 0;
      boss.onGround = true;
    }
  }
  // floor
  if(boss.y + boss.h > H-10){ boss.y = H-10-boss.h; boss.vy=0; boss.onGround=true; }

  // ── HORIZONTAL CHASE ──
  boss.chaseTimer++;
  const px = P.x + P.w/2;
  const bCx = boss.x + boss.w/2;
  const diffX = px - bCx;

  // chase player horizontally
  if(Math.abs(diffX) > 30){
    boss.vx = diffX > 0 ? spd : -spd;
  } else {
    boss.vx *= 0.8;
  }
  boss.x += boss.vx;
  if(boss.x < 0)          { boss.x = 0;        boss.vx = Math.abs(boss.vx); }
  if(boss.x+boss.w > W)   { boss.x = W-boss.w; boss.vx = -Math.abs(boss.vx); }

  // ── JUMP AI — اگه player بالاتر از boss هست ──
  boss.jumpCooldown--;
  if(boss.onGround && boss.jumpCooldown <= 0){
    const py = P.y + P.h/2;
    const bMy = boss.y + boss.h/2;
    // اگه player حداقل 60px بالاتره → jump
    if(bMy - py > 60){
      boss.vy = boss.enraged ? -13 : -11;
      boss.onGround = false;
      boss.jumpCooldown = boss.enraged ? 60 : 100;
    }
    // گاهی random jump برای unpredictability
    else if(boss.chaseTimer % (boss.enraged ? 120 : 200) === 0){
      boss.vy = -10;
      boss.onGround = false;
      boss.jumpCooldown = 80;
    }
  }

  // walk anim
  boss.walkTimer++; if(boss.walkTimer>6){boss.walkTimer=0;boss.walkFrame^=1;}

  // smoke particles (phase 2)
  if(boss.enraged){ boss.smokeTimer++; if(boss.smokeTimer%6===0) burst(boss.x+boss.w/2,boss.y+boss.h/2,boss.skin.glow,3); }

  // hit flash
  if(boss.hitFlash>0) boss.hitFlash--;
  if(bossShakeTimer>0) bossShakeTimer--;

  // ── ATTACK ──
  if(!P.dead){
    // collision
    if(P.invincible===0 && overlap(boss,P)) hitPlayer();

    boss.sTimer++;
    const rate = boss.enraged ? 38 : 65;

    if(boss.sTimer >= rate){
      boss.sTimer = 0;
      boss.attackMode = (boss.attackMode+1) % 3;
      const bx = boss.x+boss.w/2, by = boss.y+boss.h/2;
      const dx = (P.x+P.w/2)-bx, dy = (P.y+P.h/2)-by;
      const d  = Math.sqrt(dx*dx+dy*dy)||1;
      const spd = boss.enraged ? 4.5 : 3.2;

      if(boss.attackMode === 0){
        // targeted — aim at player + 2 side shots
        eBullets.push({x:bx,y:by,vx:(dx/d)*spd,   vy:(dy/d)*spd,   w:11,h:11,boss:true});
        eBullets.push({x:bx,y:by,vx:(dx/d)*spd*0.8+1.5,vy:(dy/d)*spd*0.8,w:9,h:9,boss:true});
        eBullets.push({x:bx,y:by,vx:(dx/d)*spd*0.8-1.5,vy:(dy/d)*spd*0.8,w:9,h:9,boss:true});
      } else if(boss.attackMode === 1){
        // spiral — 6 directions
        const count = boss.enraged ? 8 : 6;
        for(let i=0;i<count;i++){
          const a = boss.spiralAngle + (Math.PI*2/count)*i;
          eBullets.push({x:bx,y:by,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,w:9,h:9,boss:true});
        }
        boss.spiralAngle += Math.PI/8;
      } else {
        // spread — shotgun style 5 bullets
        for(let i=-2;i<=2;i++){
          const a = Math.atan2(dy,dx) + i*0.28;
          eBullets.push({x:bx,y:by,vx:Math.cos(a)*(spd+0.5),vy:Math.sin(a)*(spd+0.5),w:10,h:10,boss:true});
        }
      }
    }
  }

  // کشته شد
  if(boss.hp <= 0){
    const bossCoins = Math.ceil(boss.maxHp/2);
    score += boss.maxHp * 8;
    kills++;
    gameOverCoinsEarned += bossCoins;
    coins += bossCoins;
    saveAll();
    burst(boss.x+boss.w/2, boss.y+boss.h/2, '#ff2200', 40);
    burst(boss.x+boss.w/2, boss.y+boss.h/2, '#ffcc00', 30);
    burst(boss.x+boss.w/2, boss.y+boss.h/2, '#ffffff', 20);
    floatText(boss.x+boss.w/2, boss.y, '💀 BOSS DOWN!', '#ff2200');
    floatText(boss.x+boss.w/2, boss.y-24, '🪙+'+coins, '#ffcc44');
    // power-up تضمینی
    dropPowerup(boss.x+boss.w/2, boss.y+boss.h/2, ['rapid','triple','shield'][Math.floor(Math.random()*3)]);
    boss = null;
    bossDefeatedTimer = 180;
    // level up بعد از boss
    doLevelUp();
  }
}

function hitBoss(dmg){
  if(!boss) return false;
  boss.hp  -= dmg||1;
  boss.hitFlash = 10;
  bossShakeTimer = 8;
  burst(boss.x+boss.w/2, boss.y+boss.h/2, '#ff6600', 6);
  return true;
}

// draw boss — 10 skins
function drawBoss(){
  if(!boss) return;

  const flash = boss.hitFlash > 0;
  const rage  = boss.enraged;
  const sk    = boss.skin;

  // screen shake
  const sx = bossShakeTimer>0 ? (Math.random()-0.5)*6 : 0;
  const sy = bossShakeTimer>0 ? (Math.random()-0.5)*6 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  // glow aura
  ctx.shadowColor = sk.glow;
  ctx.shadowBlur  = flash ? 55 : (rage ? 38 : 22) + Math.sin(frame*0.1)*8;

  const bx = boss.x, by = boss.y;
  const bw = boss.w, bh = boss.h;

  const s = c => flash ? '#ffffff' : c;

  // ── LEGS ──
  const lL = boss.walkFrame?8:0, lR = boss.walkFrame?0:8;
  ctx.fillStyle = s(sk.body);
  ctx.fillRect(bx+8,     by+72, 22, 28+lL);
  ctx.fillRect(bx+bw-30, by+72, 22, 28+lR);
  // shoes
  ctx.fillStyle = s('#111');
  ctx.fillRect(bx+5,     by+100+lL, 26, 8);
  ctx.fillRect(bx+bw-33, by+100+lR, 26, 8);

  // ── TORSO ──
  ctx.fillStyle = s(sk.body);
  ctx.fillRect(bx+6, by+36, bw-12, 38);
  // belly stripe (for variety)
  ctx.fillStyle = s(sk.head);
  ctx.fillRect(bx+18, by+42, bw-36, 20);

  // ── ARMS ──
  const aw = boss.walkFrame ? 5 : -5;
  ctx.fillStyle = s(sk.body);
  ctx.fillRect(bx-12, by+38+aw, 14, 32);
  ctx.fillRect(bx+bw-2, by+38-aw, 14, 32);
  // fists
  ctx.fillStyle = s(sk.head);
  ctx.fillRect(bx-14, by+68+aw, 16, 14);
  ctx.fillRect(bx+bw-4, by+68-aw, 16, 14);

  // ── HEAD ──
  ctx.fillStyle = s(sk.head);
  ctx.fillRect(bx+4, by, bw-8, 40);

  // ── HORNS (shape varies by skin index) ──
  ctx.fillStyle = s(sk.horn);
  ctx.shadowColor = sk.horn; ctx.shadowBlur = 12;
  const si = BOSS_SKINS.indexOf(sk);
  if(si % 3 === 0){
    // classic pointed horns
    ctx.beginPath();
    ctx.moveTo(bx+10,by); ctx.lineTo(bx+6,by-22); ctx.lineTo(bx+20,by-4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bx+bw-10,by); ctx.lineTo(bx+bw-6,by-22); ctx.lineTo(bx+bw-20,by-4); ctx.fill();
  } else if(si % 3 === 1){
    // wide crown horns
    for(let i=0;i<3;i++){
      ctx.fillRect(bx+8+i*20, by-16-i%2*8, 8, 18+i%2*8);
    }
  } else {
    // spiral/spike horns
    ctx.fillRect(bx+6,  by-18, 12, 20);
    ctx.fillRect(bx+bw-18, by-18, 12, 20);
    ctx.fillRect(bx+10, by-24, 6,  8);
    ctx.fillRect(bx+bw-16, by-24, 6, 8);
  }
  ctx.shadowBlur = 0;

  // ── EYES ──
  const eyePulse = Math.sin(frame*0.18)*0.5+0.5;
  ctx.shadowColor = sk.eye; ctx.shadowBlur = 14+eyePulse*14;
  ctx.fillStyle   = s(sk.eye);
  ctx.fillRect(bx+10, by+7, 16, 14);
  ctx.fillRect(bx+bw-26, by+7, 16, 14);
  // pupils
  ctx.fillStyle = s('#000');
  ctx.fillRect(bx+14, by+10, 8, 8);
  ctx.fillRect(bx+bw-22, by+10, 8, 8);
  // angry eyebrows when enraged
  if(rage){
    ctx.fillStyle=s(sk.horn); ctx.shadowBlur=0;
    ctx.fillRect(bx+9, by+5, 18, 4);
    ctx.fillRect(bx+bw-27, by+5, 18, 4);
  }
  ctx.shadowBlur=0;

  // ── MOUTH / TEETH ──
  ctx.fillStyle = s('#111');
  ctx.fillRect(bx+10, by+26, bw-20, 12);
  ctx.fillStyle = s(sk.teeth);
  for(let i=0;i<5;i++) ctx.fillRect(bx+11+i*10, by+26, 7, 10);
  // bottom teeth
  ctx.fillStyle = s(sk.teeth);
  for(let i=0;i<4;i++) ctx.fillRect(bx+16+i*10, by+33, 6, 5);

  // ── SCAR (always visible) ──
  if(!flash){
    ctx.strokeStyle = sk.horn; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(bx+20,by+8); ctx.lineTo(bx+28,by+20); ctx.stroke();
  }

  // ── SKIN NAME TAG ──
  ctx.shadowBlur=0;
  ctx.fillStyle = sk.glow; ctx.font='bold 9px Arial Black';
  ctx.textAlign='center';
  ctx.fillText(sk.icon+' '+sk.name.toUpperCase(), bx+bw/2, by-32);

  // ── HP BAR ──
  const barW=bw+24, barX=bx-12, barY=by-22;
  ctx.fillStyle='#111'; ctx.fillRect(barX,barY,barW,9);
  const pct=boss.hp/boss.maxHp;
  const barCol=pct>0.5?sk.glow:pct>0.25?'#ff8800':'#ff2200';
  ctx.fillStyle=barCol; ctx.shadowColor=barCol; ctx.shadowBlur=8;
  ctx.fillRect(barX,barY,barW*pct,9);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='bold 8px Arial'; ctx.textAlign='center';
  ctx.fillText(boss.hp+'/'+boss.maxHp, bx+bw/2, barY-2);

  ctx.restore();
  ctx.shadowBlur=0;
}

//  QUIZ — Grade 4 Canada Math
// ═══════════════════════════════════════════════
let quiz = null; // { q, answer, choices, timeLeft, selected, result, zones }

function makeQuiz(){
  const type = Math.floor(Math.random()*3); // 0=add, 1=sub, 2=mul
  let a, b, answer, symbol;

  if(type === 0){          // Addition — easy 1-digit + 1-digit or small 2-digit
    a = 5 + Math.floor(Math.random()*25);   // 5..29
    b = 5 + Math.floor(Math.random()*25);   // 5..29
    answer = a + b; symbol = '+';
  } else if(type === 1){   // Subtraction — small numbers, positive result
    b = 2 + Math.floor(Math.random()*18);   // 2..19
    a = b + 2 + Math.floor(Math.random()*18); // always a > b
    answer = a - b; symbol = '−';
  } else {                 // Multiplication — times tables 2..9 × 2..9
    a = 2 + Math.floor(Math.random()*8);    // 2..9
    b = 2 + Math.floor(Math.random()*8);    // 2..9
    answer = a * b; symbol = '×';
  }

  // 4 choices: correct + 3 wrong (close but unique)
  const wrongs = new Set();
  while(wrongs.size < 3){
    const off = (Math.floor(Math.random()*12)+1) * (Math.random()<0.5?1:-1);
    const w   = answer + off;
    if(w !== answer && w > 0) wrongs.add(w);
  }
  const choices = [...wrongs, answer].sort(()=>Math.random()-0.5);

  quiz = {
    q:        `${a}  ${symbol}  ${b}  =  ?`,
    answer,
    choices,
    timeLeft: 15 * 60, // 15 seconds × 60 fps
    selected: null,
    result:   null,     // 'correct' | 'wrong' | 'timeout'
    resultTimer: 0,
    zones: [],
  };
}

function updateQuiz(){
  if(!quiz) return;
  if(quiz.result){
    quiz.resultTimer--;
    if(quiz.resultTimer <= 0) finishQuiz();
    return;
  }
  quiz.timeLeft--;
  if(quiz.timeLeft <= 0){
    quiz.result = 'timeout';
    quiz.resultTimer = 90;
  }
}

function answerQuiz(idx){
  if(!quiz || quiz.result) return;
  quiz.selected = idx;
  if(quiz.choices[idx] === quiz.answer){
    quiz.result = 'correct';
    quiz.resultTimer = 90;
  } else {
    quiz.result = 'wrong';
    quiz.resultTimer = 90;
  }
}

function finishQuiz(){
  const res = quiz.result;
  quiz = null;
  if(res === 'correct'){
    // زنده برگرد با 3 جون + shield
    state = 'playing';
    P.dead      = false;
    P.lives     = 3;
    P.deathTimer = 0;
    P.invincible = 200;
    P.shield     = 240;
    P.x = 290; P.y = 395; P.vy = 0;

    // 15% از HP boss کم کن
    if(boss){
      const dmg = Math.ceil(boss.maxHp * 0.15);
      boss.hp   = Math.max(1, boss.hp - dmg);
      boss.hitFlash = 20;
      bossShakeTimer = 15;
      burst(boss.x+boss.w/2, boss.y+boss.h/2, '#ffcc00', 18);
      floatText(boss.x+boss.w/2, boss.y-10, '−'+dmg+' HP  (−15%)', '#ffcc00');
    }

    floatText(P.x+P.w/2, P.y-30, '✅ CORRECT!', '#00ff88');
    floatText(P.x+P.w/2, P.y-50, '❤❤❤ +3 LIVES!', '#ff4488');
    burst(P.x+P.w/2, P.y, '#00ff88', 25);
    burst(P.x+P.w/2, P.y, '#ff4488', 15);
    syncControlsVisibility();
  } else {
    // game over واقعی
    P.dead = true; P.deathTimer = 1;
    state = 'playing';
  }
}

function drawQuiz(){
  if(!quiz) return;

  // تاریک کن پس‌زمینه
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0,0,W,H);

  const cx = W/2, cardW = 480, cardH = 320, cardX = cx-cardW/2, cardY = 60;

  // card
  roundRect(cardX, cardY, cardW, cardH, 18, '#0a0a20', '#cc44ff', 2.5);
  ctx.shadowColor='#cc44ff'; ctx.shadowBlur=30;
  roundRect(cardX, cardY, cardW, cardH, 18, '', '#cc44ff', 2.5);
  ctx.shadowBlur=0;

  // header
  ctx.textAlign='center';
  ctx.fillStyle='#cc44ff'; ctx.font='bold 13px Arial Black';
  ctx.fillText('⚡ SECOND CHANCE — Answer to keep playing!', cx, cardY+22);

  // timer bar
  const pct  = quiz.timeLeft / (15*60);
  const barW = cardW-40, barX = cardX+20, barY2 = cardY+30;
  const barCol = pct>0.5?'#00ff88':pct>0.25?'#ffcc00':'#ff4444';
  ctx.fillStyle='#222'; roundRect(barX,barY2,barW,8,4,'#222','');
  ctx.fillStyle=barCol; ctx.shadowColor=barCol; ctx.shadowBlur=8;
  if(pct>0) roundRect(barX,barY2,barW*pct,8,4,barCol,'');
  ctx.shadowBlur=0;
  const secs = Math.ceil(quiz.timeLeft/60);
  ctx.fillStyle=barCol; ctx.font='bold 11px Arial';
  ctx.fillText(secs+'s', cx, barY2+20);

  // question
  ctx.fillStyle='#ffffff'; ctx.font='bold 42px Arial Black';
  ctx.shadowColor='#ffffff'; ctx.shadowBlur=12;
  ctx.fillText(quiz.q, cx, cardY+110);
  ctx.shadowBlur=0;

  // grade label
  ctx.fillStyle='#666688'; ctx.font='11px Arial';
  ctx.fillText('Grade 4 Math  ·  Canada Curriculum', cx, cardY+132);

  // result overlay
  if(quiz.result){
    const ok = quiz.result==='correct';
    const col = ok?'#00ff88':quiz.result==='timeout'?'#ffcc00':'#ff4444';
    const msg = ok?'✅ Correct! You\'re back!':quiz.result==='timeout'?'⏰ Time\'s up!':'❌ Wrong answer!';
    ctx.fillStyle=col; ctx.font='bold 26px Arial Black';
    ctx.shadowColor=col; ctx.shadowBlur=25;
    ctx.fillText(msg, cx, cardY+170);
    ctx.shadowBlur=0;
    ctx.textAlign='left'; return;
  }

  // 4 answer buttons — 2×2 grid
  quiz.zones = [];
  const btnW=210, btnH=54, gap=12;
  const gridX=cardX+20, gridY=cardY+148;
  quiz.choices.forEach((ch,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const bx=gridX+col*(btnW+gap), by=gridY+row*(btnH+gap);
    const hover = mouseX>=bx&&mouseX<=bx+btnW&&mouseY>=by&&mouseY<=by+btnH;
    const bgCol = hover?'#1a1a40':'#111130';
    const borderCol = hover?'#cc44ff':'#3a3a60';
    roundRect(bx,by,btnW,btnH,10,bgCol,borderCol,hover?2:1.5);
    if(hover){ ctx.shadowColor='#cc44ff'; ctx.shadowBlur=12; roundRect(bx,by,btnW,btnH,10,'',borderCol,2); ctx.shadowBlur=0; }
    ctx.fillStyle='#fff'; ctx.font='bold 22px Arial Black'; ctx.textBaseline='middle';
    ctx.fillText(String(ch), bx+btnW/2, by+btnH/2);
    ctx.textBaseline='alphabetic';
    quiz.zones.push({x:bx,y:by,w:btnW,h:btnH,idx:i});
  });

  ctx.textAlign='left';
}

function canvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * (W / rect.width),
    y: (clientY - rect.top)  * (H / rect.height),
  };
}
function handleCanvasInteract(cx, cy) {
  if (state === 'title')     handleTitleClick(cx, cy);
  if (state === 'shop')      handleShopClick(cx, cy);
  if (state === 'gameover')  handleGameOverClick(cx, cy);
  if (state === 'quiz') {
    if(quiz && !quiz.result && quiz.zones){
      for(const z of quiz.zones){
        if(cx>=z.x&&cx<=z.x+z.w&&cy>=z.y&&cy<=z.y+z.h){
          answerQuiz(z.idx); return;
        }
      }
    }
  }
  if (state === 'enterName') {
    for(const z of dropdownZones){
      if(cx>=z.x&&cx<=z.x+z.w&&cy>=z.y&&cy<=z.y+z.h){ z.action(); return; }
    }
  }
}
function handleGameOverClick(mx, my) {

  if (mx > W/2-110 && mx < W/2+110 && my > btnY && my < btnY+42) goToShop();

}

const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const btnJump      = document.getElementById('btn-jump');

const JOYSTICK_RADIUS = 55; // max knob travel (px on screen)
const DEAD_ZONE       = 10; // min px to register movement

let joyActive   = false;
let joyOriginX  = 0;
let joyOriginY  = 0;
let joyTouchId  = null;
let joyKnobDx   = 0; // -1..1 نرمال‌شده برای smooth speed

function joystickStart(cx, cy) {
  joyActive  = true;
  joyOriginX = cx;
  joyOriginY = cy;
  joystickBase.style.display = 'block';
  joystickBase.style.left = cx + 'px';
  joystickBase.style.top  = cy + 'px';
  joystickKnob.style.left = cx + 'px';
  joystickKnob.style.top  = cy + 'px';
}

function joystickMove(cx, cy) {
  if (!joyActive) return;
  const dx = cx - joyOriginX;
  const dy = cy - joyOriginY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const clamped = Math.min(dist, JOYSTICK_RADIUS);
  const angle   = Math.atan2(dy, dx);
  const knobX   = joyOriginX + Math.cos(angle) * clamped;
  const knobY   = joyOriginY + Math.sin(angle) * clamped;

  joystickKnob.style.left = knobX + 'px';
  joystickKnob.style.top  = knobY + 'px';

  // نرمال‌سازی برای smooth speed
  joyKnobDx = Math.abs(dx) > DEAD_ZONE ? Math.max(-1, Math.min(1, dx / JOYSTICK_RADIUS)) : 0;

  // legacy keys (برای jump logic)
  if (dx > DEAD_ZONE)        { keys['KeyD'] = true;  keys['KeyA'] = false; }
  else if (dx < -DEAD_ZONE)  { keys['KeyA'] = true;  keys['KeyD'] = false; }
  else                       { keys['KeyA'] = false;  keys['KeyD'] = false; }
}

function joystickEnd() {
  joyActive  = false;
  joyTouchId = null;
  joyKnobDx  = 0;
  keys['KeyA'] = false;
  keys['KeyD'] = false;
  joystickBase.style.display = 'none';
}

// ── Joystick touch events ──
joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  joystickStart(t.clientX, t.clientY);
}, {passive: false});

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) joystickMove(t.clientX, t.clientY);
  }
}, {passive: false});

joystickZone.addEventListener('touchend',    e => { e.preventDefault(); joystickEnd(); }, {passive:false});
joystickZone.addEventListener('touchcancel', e => { e.preventDefault(); joystickEnd(); }, {passive:false});

// ── AUTO-SHOOT: aims at nearest enemy (including upward) ──
let autoShootTimer = 0;

function getNearestTarget() {
  // ترتیب: boss اول، بعد نزدیک‌ترین دشمن
  let best = null, bestDist = Infinity;
  const px = P.x + P.w/2, py = P.y + P.h/2;
  if (boss && boss.landed) {
    const dx = (boss.x+boss.w/2)-px, dy = (boss.y+boss.h/2)-py;
    bestDist = Math.sqrt(dx*dx+dy*dy);
    best = { x: boss.x+boss.w/2, y: boss.y+boss.h/2 };
  }
  for (const e of enemies) {
    const dx = (e.x+e.w/2)-px, dy = (e.y+e.h/2)-py;
    const d  = Math.sqrt(dx*dx+dy*dy);
    if (d < bestDist) { bestDist=d; best={ x:e.x+e.w/2, y:e.y+e.h/2 }; }
  }
  return best;
}

function shootPlayerAimed(tx, ty) {
  if (P.dead || P.shootCD > 0) return;
  const gd  = GUNS[P.gunType] || GUNS.pistol;
  const cd  = P.powerup==='rapid' ? Math.floor(gd.cd*0.4) : gd.cd;
  const px  = P.x + P.w/2, py = P.y + 12;
  const dx  = tx - px,     dy  = ty - py;
  const len = Math.sqrt(dx*dx+dy*dy) || 1;
  const spd = gd.spd;
  const col = gd.color;

  // update facing based on horizontal direction
  if (dx > 0) P.facing = 1; else if (dx < 0) P.facing = -1;

  const bx = P.x + (P.facing > 0 ? P.w+2 : -14);

  if (P.powerup === 'triple') {
    const base = Math.atan2(dy, dx);
    for (let i=-1; i<=1; i++) {
      const a = base + i*0.18;
      bullets.push({x:bx,y:py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  } else if (gd.count > 1) {
    // shotgun — spread around aim direction
    for (let i=0; i<gd.count; i++) {
      const base  = Math.atan2(dy,dx);
      const spread = gd.spread > 0 ? (i/(gd.count-1)-0.5)*gd.spread*2 : 0;
      bullets.push({x:bx,y:py,vx:Math.cos(base+spread)*spd,vy:Math.sin(base+spread)*spd,w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
    }
  } else {
    bullets.push({x:bx,y:py,vx:(dx/len)*spd,vy:(dy/len)*spd,w:12,h:5,col,pierce:gd.pierce,explode:gd.explode,gun:P.gunType});
  }
  P.shootCD = cd;
}

function updateAutoShoot() {
  if (state !== 'playing' || !('ontouchstart' in window)) return;
  if (!P || P.dead) return;
  const gd = GUNS[P.gunType] || GUNS.pistol;
  autoShootTimer++;
  if (autoShootTimer >= gd.cd) {
    autoShootTimer = 0;
    const target = getNearestTarget();
    if (target) {
      shootPlayerAimed(target.x, target.y);
    } else {
      // هیچ دشمنی نیست → شلیک به جهت facing
      shootPlayer();
    }
  }
}

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function applyPlatformLanding(ent){
  ent.onGround=false;
  for(const pl of PLAT_LAYOUT){
    const prevB=ent.y+ent.h-ent.vy;
    if(ent.x+ent.w>pl.x&&ent.x<pl.x+pl.w&&ent.y+ent.h>=pl.y&&prevB<=pl.y+8&&ent.vy>=0){
      ent.y=pl.y-ent.h; ent.vy=0; ent.onGround=true;
    }
  }
}

// ═══════════════════════════════════════════════
function burst(x,y,color,n){
  n=n||12;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:40+Math.random()*30,maxLife:70,color,r:Math.random()*3+1});
  }
}
function floatText(x,y,text,color){ floatingTexts.push({x,y,text,color,life:70,maxLife:70}); }

// ═══════════════════════════════════════════════
//  SPAWNER  — sinusoidal difficulty
//
//  ایده: سختی به جای خطی، موجی (sinusoidal) هست
//  هر ~6 لول یه چرخه کامل:
//    - 3 لول اول: سخت‌تر میشه
//    - 1 لول: نفس (آروم‌تر)
//    - دوباره...
//  با trend کلی که به تدریج بالا میره
// ═══════════════════════════════════════════════
let spawnTimer=0;

// مقدار سختی بین 0 (آسون) تا 1 (سخت)
function difficultyWave(){
  const trend  = Math.min(1, (level-1) / 30);          // trend کلی: لول 1→0، لول 30→1
  const wave   = Math.sin((level-1) * Math.PI / 3);    // موج هر 6 لول یه دوره
  // wave بین -1 و 1 — نرمالایز به 0..1
  const waveN  = (wave + 1) / 2;
  // ترکیب: 60% trend + 40% wave
  return Math.max(0, Math.min(1, trend*0.6 + waveN*0.4));
}

function spawnInterval(){
  const d = difficultyWave();
  // آسون: 160 فریم، سخت: 45 فریم
  return Math.round(160 - d * 115);
}

function maxOnScreen(){
  const d = difficultyWave();
  // آسون: 2 دشمن، سخت: 8 دشمن
  return Math.round(2 + d * 6);
}

function killTarget(){ return Math.max(1, level); }

// ═══════════════════════════════════════════════
function startGame(){
  // پاک کردن همه کلیدها تا از صفحه قبل چیزی نمونه
  Object.keys(keys).forEach(k => keys[k] = false);
  // اگه slug داره و اسم نداره → صفحه اسم نشون بده
  if(GAME_CFG.slug && !playerName){
    state='enterName';
    return;
  }
  state='playing';
  syncControlsVisibility();
  score=0;level=1;kills=0;killsThisLevel=0;
  frame=0;spawnTimer=0;
  levelUpTimer=0;mapChangeBannerTimer=0;rewardBannerTimer=0;
  rewardTimer=0;rewardBurstTimer=0;
  gameOverCoinsEarned=0;
  bonusGiven=false;
  _bhScoreSaved=false; // reset برای بازی جدید
  boss=null;bossWarningTimer=0;bossDefeatedTimer=0;bossFlashTimer=0;bossShakeTimer=0;
  quiz=null;
  currentThemeIdx=0;
  PLAT_LAYOUT=ALL_LAYOUTS[0].map(p=>({...p,isGround:!!p.isGround}));
  platLayoutIdx=0;platTransition=0;platOldLayout=platNewLayout=null;
  enemies=[];bullets=[];eBullets=[];powerups=[];particles=[];floatingTexts=[];
  P=makePlayer();
  rebuildStars();
}

let bonusGiven = false; // فقط یه بار bonus بدیم

function goToShop(){
  Object.keys(keys).forEach(k => keys[k] = false);
  syncControlsVisibility();

  // اگه از gameover صدا زده شده → مستقیم بره shop
  if(state === 'gameover'){
    state = 'shop';
    shopTab = 'chars';
    return;
  }

  // Give end-of-run coins bonus from score — فقط یه بار
  if(!bonusGiven){
    bonusGiven = true;
    const bonus = Math.floor(score/40);
    if(bonus > 0){
      coins += bonus;
      gameOverCoinsEarned += bonus;
      saveAll();
    }
  }

  // اگه slug داره → اول gameover (leaderboard) نشون بده
  if(GAME_CFG.slug){
    state = 'gameover';
  } else {
    state = 'shop';
    shopTab = 'chars';
  }
}

function doLevelUp(){
  level++;killsThisLevel=0;levelUpTimer=150;
  if(level%2===0&&P.lives<9){ P.lives++; floatText(P.x+P.w/2,P.y-20,'+1 UP!','#ff4488'); }
  updateTheme();
}

function onKill(e){
  score+=e.pts; kills++; killsThisLevel++;
  // Coins per kill
  const c=Math.ceil(e.pts/4);
  coins+=c; gameOverCoinsEarned+=c;
  saveAll();
  floatText(e.x+e.w/2,e.y,'+'+e.pts,'#ffff88');
  floatText(e.x+e.w/2,e.y-18,'🪙+'+c,'#ffcc44');
  burst(e.x+e.w/2,e.y+e.h/2,e.col.body,16);
  maybeDropFromKill(e.x+e.w/2,e.y);
  while(killsThisLevel>=killTarget()){ killsThisLevel-=killTarget(); doLevelUp(); }
}

function hitPlayer(){
  if(P.invincible>0||P.dead)return;
  if(P.shield>0){ P.shield=0;P.invincible=60;floatText(P.x+P.w/2,P.y-20,'BLOCKED!','#44aaff');burst(P.x+P.w/2,P.y+P.h/2,'#44aaff',10);return; }
  P.lives--;
  burst(P.x+P.w/2,P.y+P.h/2,'#ff4444',12);
  if(P.lives<=0){
    // quiz میاد — اگه جواب درست داد زنده میشه!
    P.dead=true; P.deathTimer=999; // نگه دار تا quiz تموم بشه
    state='quiz';
    makeQuiz();
    Object.keys(keys).forEach(k=>keys[k]=false);
    syncControlsVisibility();
  } else {
    P.invincible=110;
  }
}

function collectPower(p){
  const t=p.type;const def=POWERUP_DEFS[t];
  burst(p.x,p.y,def.color,12);
  if(t==='life'){ if(P.lives<9)P.lives++; floatText(p.x,p.y,'+1 UP!',def.color); }
  else if(t==='bomb'){
    for(const e of enemies){score+=e.pts;kills++;killsThisLevel++;const c=Math.ceil(e.pts/4);coins+=c;gameOverCoinsEarned+=c;burst(e.x+e.w/2,e.y+e.h/2,e.col.body,18);floatText(e.x+e.w/2,e.y,'+'+e.pts,'#ffff88');}
    enemies=[];eBullets=[];floatText(p.x,p.y-20,'BOOM!',def.color);saveAll();
    while(killsThisLevel>=killTarget()){killsThisLevel-=killTarget();doLevelUp();}
  }
  else if(t==='shield'){ P.shield=300; floatText(p.x,p.y,'SHIELD!',def.color); }
  else { P.powerup=t;P.powerupTimer=420;floatText(p.x,p.y,def.label,def.color); }
}

//  UPDATE FUNCTIONS
// ═══════════════════════════════════════════════
function updatePlayer(){
  if(P.dead){
    P.deathTimer--;
    if(P.deathTimer<=0){
      // ذخیره score — هم local (slug-based) هم platform
      saveScore(score, level).then(()=>loadLeaderboard());
      saveBHScore(); // platform save (coins + global score)
      goToShop();
    }
    return;
  }
  // joystick smooth speed — اگه joystick فعاله، از مقدار dx استفاده کن
  if (joyActive && ('ontouchstart' in window)) {
    const rawDx   = joyKnobDx; // -1..1 نرمال‌شده
    const speed   = 4.2;
    P.vx = rawDx * speed;
    if (rawDx >  0.1) P.facing =  1;
    if (rawDx < -0.1) P.facing = -1;
  } else if(keys['KeyA']||keys['ArrowLeft']){P.vx=-3.8;P.facing=-1;}
  else if(keys['KeyD']||keys['ArrowRight']){P.vx=3.8;P.facing=1;}
  else P.vx*=0.72;
  if((keys['KeyW']||keys['Space'])&&P.onGround){P.vy=-12.5;P.onGround=false;}
  P.vy=Math.min(P.vy+0.55,15);
  P.x+=P.vx;P.y+=P.vy;
  if(P.x<0)P.x=0;if(P.x+P.w>W)P.x=W-P.w;
  if(P.y>H+60){hitPlayer();P.x=290;P.y=395;P.vy=0;}
  applyPlatformLanding(P);
  if(P.shootCD>0)P.shootCD--;
  if(P.invincible>0)P.invincible--;
  if(P.shield>0)P.shield--;
  if(P.powerupTimer>0){P.powerupTimer--;if(!P.powerupTimer)P.powerup=null;}
  if(keys['KeyJ']||keys['KeyS'])shootPlayer();
  if(Math.abs(P.vx)>0.5&&P.onGround){P.walkTimer++;if(P.walkTimer>7){P.walkTimer=0;P.walkFrame^=1;}}else P.walkFrame=0;
}

function updateEnemies(){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.phase+=0.04;e.y=e.baseY+Math.sin(e.phase)*7;e.x+=e.vx;
    if(e.x<-60||e.x>W+60){e.vx*=-1;e.baseY=e.y;}
    if(!P.dead){
      e.sTimer++;
      if(e.sTimer>=e.sRate){
        e.sTimer=0;
        const dx=(P.x+P.w/2)-(e.x+e.w/2),dy=(P.y+P.h/2)-(e.y+e.h/2);
        const d=Math.sqrt(dx*dx+dy*dy)||1,spd=3.2+level*0.18;
        eBullets.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(dx/d)*spd,vy:(dy/d)*spd,w:9,h:9});
      }
      if(P.invincible===0&&overlap(e,P))hitPlayer();
    }
    if(e.hitFlash>0)e.hitFlash--;
    e.walkTimer=(e.walkTimer||0)+1;if(e.walkTimer>8){e.walkTimer=0;e.walkFrame=(e.walkFrame||0)^1;}
  }
}

function updateBullets(){
  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)return false;

    // boss hit check
    if(boss && boss.landed && overlap(b, boss)){
      if(b.explode){
        // rocket AOE روی boss
        hitBoss(4);
        burst(b.x,b.y,'#ff6600',20);
        return false;
      }
      hitBoss(1);
      return b.pierce;
    }

    for(let i=enemies.length-1;i>=0;i--){
      if(overlap(b,enemies[i])){
        if(b.explode){
          for(let j=enemies.length-1;j>=0;j--){
            if(Math.hypot(enemies[j].x-b.x,enemies[j].y-b.y)<70){
              enemies[j].hp--;enemies[j].hitFlash=8;
              if(enemies[j].hp<=0){onKill(enemies[j]);enemies.splice(j,1);}
            }
          }
          burst(b.x,b.y,'#ff6600',20);
          return false;
        }
        enemies[i].hp--;enemies[i].hitFlash=8;
        burst(b.x,b.y,enemies[i].col.body,5);
        if(enemies[i].hp<=0){onKill(enemies[i]);enemies.splice(i,1);}
        return b.pierce;
      }
    }
    return true;
  });
  eBullets=eBullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)return false;
    if(!P.dead&&overlap(b,P)){hitPlayer();burst(b.x,b.y,'#ff4444',6);return false;}
    return true;
  });
}

function updatePowerups(){
  powerups=powerups.filter(p=>{
    if(!p.landed){
      p.vy+=0.55;p.y+=p.vy;
      for(const pl of PLAT_LAYOUT){
        const prevB=p.y+8-p.vy;
        if(p.x+8>pl.x&&p.x-8<pl.x+pl.w&&p.y+8>=pl.y&&prevB<=pl.y+8&&p.vy>=0){
          p.y=pl.y-8;p.vy=0;p.landed=true;break;
        }
      }
      if(p.y>H+60)return false;
    }
    p.bob+=0.08;p.life--;
    if(p.life<=0)return false;
    if(!P.dead&&overlap({x:p.x-12,y:p.y-12,w:24,h:24},P)){collectPower(p);return false;}
    return true;
  });
}

function updateParticles(){
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});
  floatingTexts=floatingTexts.filter(t=>{t.y-=0.8;t.life--;return t.life>0;});
}

function updateSpawner(){
  // boss level — فقط boss، دشمن معمولی spawn نمیشه
  if(isBossLevel()){
    if(!boss && bossWarningTimer===0 && bossDefeatedTimer===0){
      // اولین بار تو این لول → warning شروع کن
      bossWarningTimer = 120;
      enemies = []; // همه دشمن‌های موجود رو پاک کن
      eBullets = [];
    }
    if(bossWarningTimer>0){
      bossWarningTimer--;
      if(bossWarningTimer===0) spawnBoss();
    }
    return;
  }
  // لول معمولی
  spawnTimer++;
  if(spawnTimer>=spawnInterval()&&enemies.length<maxOnScreen()){
    spawnTimer=0;spawnEnemy();
  }
}
function updateRewardTimer(){
  if(P.dead)return;
  rewardTimer++;if(rewardTimer>=600){rewardTimer=0;spawnGuaranteedReward();}
  if(rewardBurstTimer>0)rewardBurstTimer--;
}

// ═══════════════════════════════════════════════
//  DRAWING HELPERS
// ═══════════════════════════════════════════════
function roundRect(x,y,w,h,r,fill,stroke,lw){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.stroke();}
}

function drawRobloxChar(ox,oy,shirt,pants,headC,hatC,facing,walkFrame,scale,flash,shoesC){
  scale=scale||1;flash=flash||false;
  const shoeCol = shoesC||'#001a66';
  ctx.save();
  ctx.translate(ox+(facing>0?0:24*scale),oy);ctx.scale(facing*scale,scale);
  const s=c=>flash?'#ffffff':c;
  // Head
  roundRect(3,0,18,18,3,s(headC),'#00000044');
  ctx.fillStyle=flash?'#fff':'#333';ctx.fillRect(6,5,4,4);ctx.fillRect(14,5,4,4);
  ctx.fillStyle=flash?'#fff':'#111';ctx.fillRect(7,6,2,2);ctx.fillRect(15,6,2,2);
  ctx.strokeStyle=flash?'#fff':'#555';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(12,13,3,0.2,Math.PI-0.2);ctx.stroke();
  // Hat (only draw if hatC provided)
  if(hatC){ ctx.fillStyle=s(hatC);ctx.fillRect(2,-7,20,7);ctx.fillRect(5,-10,14,4); }
  // Torso
  roundRect(2,18,20,18,2,s(shirt),'#00000033');
  // Arms
  const sw=walkFrame?3:-3;
  roundRect(-4,18+sw,7,16,2,s(shirt),'#00000033');
  roundRect(21,18-sw,7,16,2,s(shirt),'#00000033');
  // Legs
  const lL=walkFrame?5:0,lR=walkFrame?0:5;
  roundRect(3,36,8,14+lL,2,s(pants),'#00000033');
  roundRect(13,36,8,14+lR,2,s(pants),'#00000033');
  // Shoes
  roundRect(3,50+lL,8,5,1,s(shoeCol),'');
  roundRect(13,50+lR,8,5,1,s(shoeCol),'');
  // Gun
  roundRect(22,24,12,6,2,flash?'#fff':'#888','');
  ctx.fillStyle=flash?'#fff':'#aaa';ctx.fillRect(31,24,5,4);
  ctx.restore();
}

// ═══════════════════════════════════════════════
//  DRAW SCENE
// ═══════════════════════════════════════════════
function drawBackground(){
  const th=getTheme();
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky0);g.addColorStop(1,th.sky1);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.blink+=s.speed;const a=0.3+Math.sin(s.blink)*0.28;
    ctx.globalAlpha=a;ctx.fillStyle=th.starC;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawOnePlatform(pl,th,offY){
  offY=offY||0;
  const c=pl.isGround?th.groundC:th.platC,t=pl.isGround?th.groundT:th.platT,y=pl.y+offY;
  ctx.fillStyle='#00000044';ctx.fillRect(pl.x+4,y+4,pl.w,pl.h+4);
  ctx.fillStyle=c;ctx.fillRect(pl.x,y,pl.w,pl.h+4);
  ctx.fillStyle=t;ctx.fillRect(pl.x,y,pl.w,3);
  ctx.fillStyle='#00000020';
  for(let bx=pl.x;bx<pl.x+pl.w;bx+=20)ctx.fillRect(bx,y,1,pl.h+4);
  ctx.shadowColor=t;ctx.shadowBlur=8;ctx.fillStyle=t;
  for(let bx=pl.x+10;bx<pl.x+pl.w-5;bx+=20)roundRect(bx-4,y-5,8,5,2,t,'');
  ctx.shadowBlur=0;
}

function drawPlatforms(){
  const th=getTheme();
  if(!platTransition){for(const pl of PLAT_LAYOUT)drawOnePlatform(pl,th,0);return;}
  if(platTransition<=30){
    const t=platTransition/30,offY=Math.round(t*(H+60));
    ctx.globalAlpha=1-t*0.6;
    for(const pl of (platOldLayout||PLAT_LAYOUT))drawOnePlatform(pl,th,offY);
    ctx.globalAlpha=1;
  } else {
    const t=(platTransition-30)/30,offY=Math.round((1-t)*(-(H+60)));
    ctx.globalAlpha=t;
    for(const pl of PLAT_LAYOUT)drawOnePlatform(pl,th,offY);
    ctx.globalAlpha=1;
  }
}

function drawPlayer(){
  if(P.dead)return;
  if(P.invincible>0&&Math.floor(P.invincible/5)%2===0)return;
  if(P.shield>0){
    ctx.shadowColor='#44aaff';ctx.shadowBlur=20+Math.sin(frame*0.15)*8;
    ctx.strokeStyle='#44aaff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(P.x+P.w/2,P.y+P.h/2,26,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=0;
  }
  const ch=CHARS[selChar]||CHARS.noob;
  drawCharSpecial(selChar,Math.round(P.x),Math.round(P.y),getShirtColor(),P.pants,P.head,P.hat,P.walkFrame,1,P.shoes);
}

function drawEnemies(){
  for(const e of enemies){
    const flash=e.hitFlash>0;
    ctx.shadowColor=e.col.body;ctx.shadowBlur=flash?28:8;
    drawRobloxChar(Math.round(e.x),Math.round(e.y),e.col.body,e.col.dark,e.col.head,null,e.vx>0?1:-1,e.walkFrame||0,1,flash);
    if(e.maxHp>1){
      ctx.shadowBlur=0;ctx.fillStyle='#333';ctx.fillRect(e.x,e.y-10,e.w,5);
      ctx.fillStyle=e.hp===e.maxHp?'#44ff44':e.hp===1?'#ff4444':'#ffaa00';
      ctx.fillRect(e.x,e.y-10,e.w*(e.hp/e.maxHp),5);
    }
    ctx.shadowBlur=0;
  }
}

function drawBullets(){
  for(const b of bullets){
    const col=b.col||'#00ff88';
    ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;
    if(b.gun==='rocket'){
      // Rocket shape
      ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill();
    } else if(b.gun==='sniper'){
      // Long thin beam
      ctx.fillRect(b.x-(b.vx>0?0:20),b.y-2,22,4);
    } else {
      ctx.fillRect(b.x,b.y-b.h/2,b.w,b.h);
      ctx.beginPath();ctx.arc(b.x+(b.vx>0?b.w:0),b.y,4,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.shadowColor='#ff3300';ctx.shadowBlur=12;
  for(const b of eBullets){
    ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(b.x,b.y,6,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff9900';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
}

function drawPowerups(){
  for(const p of powerups){
    const def=POWERUP_DEFS[p.type];
    const bob=p.landed?Math.sin(p.bob)*3:0,py=p.y+bob;
    const alpha=p.life<120?p.life/120:1;
    ctx.globalAlpha=alpha;ctx.shadowColor=def.color;ctx.shadowBlur=18;
    roundRect(p.x-13,py-13,26,26,6,def.bg,def.color,2);
    ctx.fillStyle=def.color;ctx.font='15px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.icon,p.x,py);
    if(p.landed){
      const pct=p.life/600;
      ctx.strokeStyle=def.color+'66';ctx.lineWidth=2;ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(p.x,py,17,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
}

function drawFloatingTexts(){
  for(const t of floatingTexts){
    ctx.globalAlpha=t.life/t.maxLife;ctx.fillStyle=t.color;
    ctx.shadowColor=t.color;ctx.shadowBlur=8;
    ctx.font='bold 13px Arial Black';ctx.textAlign='center';
    ctx.fillText(t.text,t.x,t.y);
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.textAlign='left';
}

let shopTab = 'chars'; // 'chars' | 'guns' | 'outfit'
const SHOP_CHAR_ORDER = ['noob','warrior','ninja','zombie','creeper','steve','impostor','skeleton','robot','alien','knight','pirate','golden','ghost'];
const SHOP_GUN_ORDER  = ['pistol','smg','shotgun','sniper','rocket'];

// Stores clickable zones for the shop

// Draws character — all chars use player outfit (shirt/pants/hat/shoes)
// Special chars only add face overlays on top of the base roblox body
function drawCharSpecial(id, ox, oy, shirt, pants, headC, hatC, walkFrame, scale, shoesC){
  const sc = scale||1;
  const ch = CHARS[id];
  const sp = ch ? ch.special : null;

  // Creeper & Impostor: fully custom body shape, but still use outfit colors
  if(sp === 'creeper'){
    ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
    // head — always green face
    ctx.fillStyle='#44cc44'; ctx.fillRect(3,0,18,18);
    ctx.fillStyle='#226622'; ctx.fillRect(5,4,4,5);ctx.fillRect(13,4,4,5);
    ctx.fillStyle='#1a4d1a'; ctx.fillRect(7,10,8,6);
    // hat on top (player's hat color)
    if(hatC){ctx.fillStyle=hatC;ctx.fillRect(2,-7,20,7);ctx.fillRect(5,-10,14,4);}
    // body with player shirt
    ctx.fillStyle=shirt; ctx.fillRect(2,18,20,18);
    ctx.fillRect(-4,walkFrame?21:15,7,16);ctx.fillRect(21,walkFrame?15:21,7,16);
    // legs with player pants
    const lL=walkFrame?5:0,lR=walkFrame?0:5;
    ctx.fillStyle=pants;ctx.fillRect(3,36,8,14+lL);ctx.fillRect(13,36,8,14+lR);
    // shoes
    ctx.fillStyle=shoesC||selShoes||'#001a66';
    ctx.fillRect(3,50+lL,8,5);ctx.fillRect(13,50+lR,8,5);
    ctx.restore();return;
  }

  if(sp === 'impostor'){
    ctx.save();ctx.translate(ox,oy);ctx.scale(sc,sc);
    // Among Us body shape with player shirt color
    ctx.fillStyle=shirt;
    ctx.beginPath();ctx.ellipse(12,26,11,16,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(19,14,7,18); // backpack
    // visor always cyan
    ctx.fillStyle='#88ccff';
    ctx.beginPath();ctx.ellipse(11,18,8,6,0,Math.PI,Math.PI*2);ctx.fill();
    // legs with pants color
    ctx.fillStyle=pants;
    const lL=walkFrame?5:0,lR=walkFrame?0:5;
    ctx.fillRect(4,38,7,14+lL);ctx.fillRect(13,38,7,14+lR);
    // shoes
    ctx.fillStyle=shoesC||selShoes||'#001a66';
    ctx.fillRect(4,52+lL,7,5);ctx.fillRect(13,52+lR,7,5);
    ctx.restore();return;
  }

  // All other chars: draw base body with player outfit, then overlay special face details
  drawRobloxChar(ox,oy,shirt,pants,headC,hatC,1,walkFrame,sc,false,shoesC||selShoes);

  // Face overlays for special chars
  if(!sp) return;
  const s2=sc;
  ctx.save();ctx.translate(ox,oy);ctx.scale(s2,s2);

  if(sp==='zombie'){
    ctx.fillStyle='#ff2200';
    ctx.fillRect(6,5,4,4);ctx.fillRect(14,5,4,4); // red zombie eyes
    ctx.fillStyle='#224400';
    ctx.fillRect(7,13,2,3);ctx.fillRect(10,13,2,3);ctx.fillRect(13,13,2,3); // dark teeth
  }
  else if(sp==='skeleton'){
    ctx.fillStyle='#111';
    ctx.fillRect(6,5,4,5);ctx.fillRect(14,5,4,5); // hollow eyes
    ctx.fillStyle='#555';
    ctx.fillRect(7,13,2,2);ctx.fillRect(10,13,2,2);ctx.fillRect(13,13,2,2); // teeth
  }
  else if(sp==='steve'){
    // Steve pixelated eyes (override default eyes)
    ctx.fillStyle='#5a3d1e';ctx.fillRect(5,4,4,4);ctx.fillRect(13,4,4,4);
    ctx.fillStyle='#7a4f28';ctx.fillRect(6,12,10,3); // mouth
  }
  else if(sp==='alien'){
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.ellipse(8,8,4,6,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(16,8,4,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#88ffaa';ctx.fillRect(10,14,4,2);
  }
  else if(sp==='knight'){
    // Helmet visor over face
    ctx.fillStyle='#aaaaaa';ctx.fillRect(3,-2,18,10);
    ctx.fillStyle='#333';ctx.fillRect(5,2,14,5);
  }
  else if(sp==='pirate'){
    ctx.fillStyle='#111';ctx.fillRect(13,4,5,5); // eyepatch
    ctx.strokeStyle='#111';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(11,6);ctx.lineTo(13,6);ctx.stroke();
  }

  ctx.restore();
}

function drawShopChars(startY){
  const cols=4,cardW=140,cardH=152,padX=6,padY=5;
  SHOP_CHAR_ORDER.forEach((id,i)=>{
    const ch=CHARS[id];
    const col=i%cols,row=Math.floor(i/cols);
    const cx=padX+col*(cardW+padX),cy=startY+row*(cardH+padY);
    const owned=unlocks.includes(id),selected=selChar===id;

    const borderCol=selected?'#ffcc00':owned?'#44ff88':'#444';
    const bgCol=selected?'#1a1500':owned?'#001a00':'#0d0d1a';
    roundRect(cx,cy,cardW,cardH,8,bgCol,borderCol,selected?2.5:1.5);
    if(selected){
      ctx.shadowColor='#ffcc00';ctx.shadowBlur=15;
      roundRect(cx,cy,cardW,cardH,8,'','#ffcc00',2.5);ctx.shadowBlur=0;
    }

    // Character preview — always use player's current outfit
    drawCharSpecial(id, cx+cardW/2-12, cy+8, selShirt, selPants, ch.head, selHat, Math.floor(frame/20)%2, 0.88, selShoes);

    // Name
    ctx.fillStyle=selected?'#ffcc00':owned?'#fff':'#888';
    ctx.font='bold 11px Arial Black';ctx.textAlign='center';
    ctx.fillText(ch.name,cx+cardW/2,cy+cardH-58);
    // Desc
    ctx.fillStyle='#555';ctx.font='9px Arial';
    ctx.fillText(ch.desc,cx+cardW/2,cy+cardH-44);

    if(selected){
      roundRect(cx+6,cy+cardH-36,cardW-12,24,6,'#443300','#ffcc00',1.5);
      ctx.fillStyle='#ffcc00';ctx.font='bold 10px Arial Black';ctx.textAlign='center';ctx.textBaseline='middle';

let outfitTab = 'shirt'; // 'shirt'|'pants'|'hat'|'shoes'

function drawShopOutfit(startY){
  const ch = CHARS[selChar] || CHARS.noob;
  const pvW=178, pvH=H-startY-10;
  const rx=pvW+18, rw=W-rx-8;

  // ── LEFT: live character preview ──
  roundRect(8,startY,pvW,pvH,10,'#0d0d1a','#2a2a4a',1.5);
  ctx.fillStyle='#888';ctx.font='bold 10px Arial Black';ctx.textAlign='center';
  ctx.fillText('PREVIEW',8+pvW/2,startY+14);

  // Detect which slot is hovered for preview
  let hShirt=selShirt,hPants=selPants,hHat=selHat,hShoes=selShoes;
  // (hover colors set inside palette loop below)

  drawCharSpecial(selChar, 8+pvW/2-18, startY+20, hShirt, hPants, ch.head, hHat, Math.floor(frame/20)%2, 1.75, hShoes);

  ctx.fillStyle='#ffcc00';ctx.font='bold 11px Arial Black';ctx.textAlign='center';
  ctx.fillText(ch.name, 8+pvW/2, startY+pvH-26);
  ctx.fillStyle='#444';ctx.font='9px Arial';
  ctx.fillText(GUNS[selGun].name+' equipped', 8+pvW/2, startY+pvH-13);
  ctx.textAlign='left';

  // ── OUTFIT SLOT TABS (top of right panel) ──
  const slotTabs=[['👕','shirt'],['👖','pants'],['🎩','hat'],['👟','shoes']];
  const tabW=Math.floor(rw/4)-2;
  slotTabs.forEach(([icon,id],i)=>{
    const tx=rx+i*(tabW+3),ty=startY,th2=26;
    const active=outfitTab===id;
    shopZones.push({x:tx,y:ty,w:tabW,h:th2,action:()=>{outfitTab=id;}});
    roundRect(tx,ty,tabW,th2,6,active?'#1a2a44':'#0a0a1a','#00b4d8'+(active?'ff':'44'),active?2:1);
    ctx.fillStyle=active?'#fff':'#556';ctx.font=active?'bold 12px Arial':'11px Arial';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(icon+' '+id.toUpperCase(),tx+tabW/2,ty+th2/2);
    ctx.textBaseline='alphabetic';ctx.textAlign='left';
  });

  // ── PALETTE GRID for active slot ──
  const sw=30,sg=5,cols2=6;
  const gridY=startY+32;
  let curSel, onSelect, label;
  if(outfitTab==='shirt') { curSel=selShirt; label='👕 Shirt Color'; onSelect=c=>{selShirt=c;if(P)P.shirt=c;}; }
  else if(outfitTab==='pants'){ curSel=selPants; label='👖 Pants Color'; onSelect=c=>{selPants=c;if(P)P.pants=c;}; }
  else if(outfitTab==='hat')  { curSel=selHat;   label='🎩 Hat Color';   onSelect=c=>{selHat=c;if(P)P.hat=c;}; }
  else                        { curSel=selShoes;  label='👟 Shoes Color'; onSelect=c=>{selShoes=c;if(P)P.shoes=c;}; }

  ctx.fillStyle='#ffcc44';ctx.font='bold 11px Arial Black';
  ctx.fillText(label, rx, gridY-2);

  // Track hovered swatch for live preview
  let hoveredCol = null;
  PALETTE.forEach((entry,i)=>{
    const {col,cost}=entry;
    const owned=unlockedColors.includes(col);
    const ci=i%cols2, ri=Math.floor(i/cols2);
    const sx=rx+ci*(sw+sg), sy=gridY+6+ri*(sw+sg);
    const isSelected=curSel===col;
    const isHovered=mouseX>=sx&&mouseX<=sx+sw&&mouseY>=sy&&mouseY<=sy+sw;
    if(isHovered&&owned) hoveredCol=col;

    ctx.shadowColor=col;ctx.shadowBlur=(isSelected||isHovered)&&owned?14:0;
    roundRect(sx,sy,sw,sw,5,owned?col:'#111',isSelected?'#fff':isHovered&&owned?'#ffffffaa':'#333',isSelected?2.5:isHovered&&owned?2:1);
    ctx.shadowBlur=0;

    if(!owned){
      // Price tag
      ctx.fillStyle='#555';ctx.font='bold 8px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🪙'+cost,sx+sw/2,sy+sw/2-3);
      ctx.fillStyle='#333';ctx.font='7px Arial';
      ctx.fillText('TAP',sx+sw/2,sy+sw/2+6);
      ctx.textBaseline='alphabetic';ctx.textAlign='left';
      shopZones.push({x:sx,y:sy,w:sw,h:sw,action:()=>{
        if(coins>=cost&&!unlockedColors.includes(col)){
          coins-=cost;unlockedColors.push(col);
          onSelect(col);saveAll();
        }
      }});
    } else {
      if(isSelected){
        ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('✓',sx+sw/2,sy+sw/2);ctx.textBaseline='alphabetic';ctx.textAlign='left';
      }
      shopZones.push({x:sx,y:sy,w:sw,h:sw,action:()=>{onSelect(col);saveAll();}});
    }
  });

  // Apply hover preview to the char on the left (re-draw over it)
  if(hoveredCol){
    let hs=selShirt,hp=selPants,hh=selHat,hsh=selShoes;
    if(outfitTab==='shirt') hs=hoveredCol;
    else if(outfitTab==='pants') hp=hoveredCol;
    else if(outfitTab==='hat')   hh=hoveredCol;
    else                         hsh=hoveredCol;
    // redraw preview with hover color
    roundRect(8,startY,pvW,pvH,10,'#0d0d1a','#2a2a4a',1.5);
    ctx.fillStyle='#00e5ff';ctx.font='bold 10px Arial Black';ctx.textAlign='center';
    ctx.fillText('PREVIEW',8+pvW/2,startY+14);
    drawCharSpecial(selChar, 8+pvW/2-18, startY+20, hs, hp, ch.head, hh, Math.floor(frame/20)%2, 1.75, hsh);
    ctx.fillStyle='#ffcc00';ctx.font='bold 11px Arial Black';ctx.textAlign='center';
    ctx.fillText(ch.name, 8+pvW/2, startY+pvH-26);
    ctx.fillStyle='#444';ctx.font='9px Arial';
    ctx.fillText(GUNS[selGun].name+' equipped', 8+pvW/2, startY+pvH-13);
    ctx.textAlign='left';
  }

  // Reset button
  const resetY=gridY+6+Math.ceil(PALETTE.length/cols2)*(sw+sg)+8;
  if(resetY+24<H-4){
    shopBtn('↺ RESET ALL',rx,resetY,110,24,'#1a0000','#ff6666',()=>{
      selShirt='#e82020';selPants='#00329e';selHat='#333333';selShoes='#001a66';
      saveAll();if(P){P.shirt=selShirt;P.pants=selPants;P.hat=selHat;P.shoes=selShoes;}
    });
  }
}

// ── Force fullscreen on Android Chrome ──
// روش: body رو یکم بزرگتر از صفحه کن تا Chrome address bar رو مخفی کنه
function forceFullscreen() {
  document.body.style.height = (window.innerHeight + 1) + 'px';
  window.scrollTo(0, 1);
  setTimeout(() => {
    document.body.style.height = window.innerHeight + 'px';
    resizeCanvas();
  }, 100);
}

// ── Request Fullscreen API (Android Chrome 支持) ──
function tryFullscreenAPI() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  if (req) {
    req.call(el).catch(() => {
      // اگه fail کرد، fallback به scroll trick
      forceFullscreen();
    });
  } else {
    forceFullscreen();
  }
}

// اولین touch کاربر → fullscreen بخواه (مرورگر فقط با gesture اجازه میده)
let fullscreenRequested = false;
document.addEventListener('touchstart', () => {
  if (!fullscreenRequested) {
    fullscreenRequested = true;
    tryFullscreenAPI();
  }
}, { once: false, passive: true });

window.addEventListener('orientationchange', () => setTimeout(() => { forceFullscreen(); resizeCanvas(); }, 400));
window.addEventListener('resize', resizeCanvas);

// ── paused state در loop ──

// override loop to handle paused state
function loop(){
  ctx.clearRect(0,0,W,H);
  frame++;

  if (state === 'paused') {
    drawBackground();
    drawPlatforms();
    drawParticles();
    drawPowerups();
    drawEnemies();
    drawBullets();
    drawBoss();
    drawPlayer();
    drawFloatingTexts();
    drawHUD();
    // dim overlay
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px Arial Black';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ PAUSED', W/2, H/2);
    ctx.textAlign = 'left';
    requestAnimationFrame(loop);
    return;
  }

  if(state==='title'){
    drawTitle();
  } else if(state==='enterName'){
    drawEnterName();
  } else if(state==='shop'){
    drawShop();
  } else if(state==='gameover'){
    drawBackground();
    drawGameOver();
  } else if(state==='quiz'){
    drawBackground();drawPlatforms();drawParticles();
    drawPowerups();drawEnemies();drawBullets();drawBoss();drawPlayer();
    drawHUD();
    updateQuiz();
    drawQuiz();
  } else {
    updatePlayer();updateEnemies();updateBullets();
    updatePowerups();updateParticles();updateSpawner();
    updateBoss();updateAutoShoot();
    updateRewardTimer();updatePlatTransition();
    // 2-player
    if(MP.active){
      if(MP.isHost){ MP.updateP2(); MP.broadcastState(); }
      else { MP.sendInput(); }
    }
    if(bossDefeatedTimer>0) bossDefeatedTimer--;
    if(bossFlashTimer>0)    bossFlashTimer--;

    if(bossFlashTimer>0){
      ctx.fillStyle=`rgba(255,0,0,${bossFlashTimer/18*0.45})`;
      ctx.fillRect(0,0,W,H);
    }

    drawBackground();drawPlatforms();drawParticles();
    drawPowerups();drawEnemies();drawBullets();
    drawBoss();
    drawPlayer();
    if(MP.active) MP.drawRemotePlayer();
    drawFloatingTexts();drawHUD();
    drawBossHUD();

    if(bossWarningTimer>0){
      const a=Math.min(1,bossWarningTimer/30);
      const pulse=Math.floor(frame/10)%2===0;
      ctx.globalAlpha=a;
      ctx.fillStyle=pulse?'#ff0000':'#cc0000';
      ctx.font='bold 36px Arial Black';
      ctx.textAlign='center';
      ctx.shadowColor='#ff0000'; ctx.shadowBlur=40;
      ctx.fillText('⚠️  BOSS INCOMING!  ⚠️',W/2,H/2-20);
      ctx.font='bold 16px Arial Black';
      ctx.fillStyle='#ffcc00';
      ctx.fillText('LVL '+level+' BOSS — Get Ready!',W/2,H/2+18);
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
    }

    if(bossDefeatedTimer>0){
      const a=Math.min(1,bossDefeatedTimer/30);
      ctx.globalAlpha=a;
      ctx.font='bold 38px Arial Black'; ctx.textAlign='center';
      ctx.fillStyle='#ffcc00'; ctx.shadowColor='#ffcc00'; ctx.shadowBlur=40;
      ctx.fillText('🎉  BOSS DEFEATED!',W/2,H/2);
      ctx.font='bold 16px Arial Black'; ctx.fillStyle='#00ff88'; ctx.shadowColor='#00ff88'; ctx.shadowBlur=20;
      ctx.fillText('Bonus coins collected!',W/2,H/2+36);
      ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.textAlign='left';
    }
  }
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════
//  2-PLAYER ONLINE ENGINE
// ═══════════════════════════════════════════════
const MP = {
  active:   false,
  isHost:   false,   // true = Player1 (host), false = Player2 (guest)
  roomCode: null,
  channel:  null,
  p2:       null,    // وضعیت player 2 (برای host که render کنه)
  syncTimer: 0,
  SYNC_INTERVAL: 6,  // هر 6 فریم = 100ms @ 60fps

  // شروع session
  async init(roomCode) {
    this.roomCode = roomCode;
    // بررسی host یا guest
    const { data: room } = await sb.from('game_sessions')
      .select('*').eq('room_code', roomCode).single();
    if (!room) return;

    const { data: { user } } = await sb.auth.getSession();
    const uid = user?.user?.id;
    this.isHost = (room.player1_id === uid);
    this.active = true;

    // channel broadcast
    this.channel = sb.channel('mp:' + roomCode)
      .on('broadcast', { event: 'state' }, ({ payload }) => {
        if (this.isHost) {
          // host: دریافت input از guest
          this._applyGuestInput(payload);
        } else {
          // guest: دریافت state کامل از host
          this._applyHostState(payload);
        }
      })
      .subscribe();

    // نشون بده
    if (this.isHost) {
      floatText(W/2, H/2-30, '👥 2P Host — Friend connected!', '#00ff88');
    } else {
      floatText(W/2, H/2-30, '👥 2P Guest — Connected to host!', '#00b4d8');
    }
  },

  // Host: broadcast state هر N فریم
  broadcastState() {
    if (!this.active || !this.isHost) return;
    this.syncTimer++;
    if (this.syncTimer < this.SYNC_INTERVAL) return;
    this.syncTimer = 0;

    this.channel.send({
      type: 'broadcast', event: 'state',
      payload: {
        // state بازی
        P2pos: this.p2 ? { x:this.p2.x, y:this.p2.y, vx:this.p2.vx, vy:this.p2.vy,
                           facing:this.p2.facing, lives:this.p2.lives,
                           dead:this.p2.dead, invincible:this.p2.invincible,
                           shirt:this.p2.shirt, walkFrame:this.p2.walkFrame } : null,
        Ppos:  { x:P.x, y:P.y, vx:P.vx, vy:P.vy,
                 facing:P.facing, lives:P.lives,
                 dead:P.dead, invincible:P.invincible,
                 shirt:P.shirt, walkFrame:P.walkFrame },
        enemies: enemies.map(e=>({ x:e.x, y:e.y, hp:e.hp, maxHp:e.maxHp, col:e.col })),
        bullets: bullets.map(b=>({ x:b.x, y:b.y, col:b.col })),
        eBullets: eBullets.map(b=>({ x:b.x, y:b.y })),
        score, level, state,
        boss: boss ? { x:boss.x, y:boss.y, hp:boss.hp, maxHp:boss.maxHp,
                       w:boss.w, h:boss.h, skin:boss.skin } : null,
      }
    });
  },

  // Guest: فرستادن input به host
  sendInput() {
    if (!this.active || this.isHost) return;
    this.syncTimer++;
    if (this.syncTimer < this.SYNC_INTERVAL) return;
    this.syncTimer = 0;

    this.channel.send({
      type: 'broadcast', event: 'state',
      payload: {
        type: 'input',
        keys: {
          left:  !!(keys['KeyA']||keys['ArrowLeft']||joyDx<-0.1),
          right: !!(keys['KeyD']||keys['ArrowRight']||joyDx>0.1),
          jump:  !!(keys['KeyW']||keys['Space']),
          shoot: !!(keys['KeyJ']||keys['KeyS']||keys['KeyX']),
        }
      }
    });
  },

  // Host: اعمال input guest
  _applyGuestInput(payload) {
    if (payload.type !== 'input' || !this.p2) return;
    const k = payload.keys;
    if (!this.p2.dead) {
      if (k.left)  { this.p2.vx=-3.8; this.p2.facing=-1; }
      else if (k.right) { this.p2.vx=3.8;  this.p2.facing=1; }
      else this.p2.vx *= 0.72;
      if (k.jump && this.p2.onGround) {
        this.p2.vy=-12.5; this.p2.onGround=false;
      }
      if (k.shoot) this._shootP2();
    }
  },

  // Guest: اعمال state از host
  _applyHostState(payload) {
    if (payload.type === 'input') return;
    // host position → P (من = player 2 از دید guest)
    if (payload.P2pos) {
      P.x=payload.P2pos.x; P.y=payload.P2pos.y;
      P.facing=payload.P2pos.facing; P.lives=payload.P2pos.lives;
      P.dead=payload.P2pos.dead; P.invincible=payload.P2pos.invincible;
      P.shirt=payload.P2pos.shirt; P.walkFrame=payload.P2pos.walkFrame;
    }
    // host pos → p1Remote (player 1 رو render کنه)
    if (payload.Ppos) this.p2 = payload.Ppos;
    // دشمن‌ها
    if (payload.enemies) {
      enemies = payload.enemies.map(e=>({
        ...e, w:24, h:36, vx:0, vy:0, phase:0,
        hitFlash:0, walkFrame:0, walkTimer:0,
        sTimer:0, sRate:100, pts:100
      }));
    }
    if (payload.bullets)  bullets  = payload.bullets.map(b=>({...b,w:12,h:5,vx:1,vy:0}));
    if (payload.eBullets) eBullets = payload.eBullets.map(b=>({...b,w:9,h:9,vx:0,vy:0}));
    if (payload.score !== undefined) score = payload.score;
    if (payload.level !== undefined) level = payload.level;
    if (payload.boss) boss = payload.boss;
  },

  // Host: شلیک P2
  _shootP2() {
    if (!this.p2 || this.p2.shootCD > 0) return;
    const gd = GUNS[selGun] || GUNS.pistol;
    bullets.push({
      x: this.p2.x + (this.p2.facing>0 ? PLAYER_W+2 : -14),
      y: this.p2.y + 12,
      vx: this.p2.facing * gd.spd, vy: 0,
      w:12, h:5, col: '#ff44aa',
      pierce: gd.pierce, explode: gd.explode, gun: selGun
    });
    this.p2.shootCD = gd.cd;
  },

  // Host: update P2 physics
  updateP2() {
    if (!this.active || !this.isHost || !this.p2) return;
    const p2 = this.p2;
    p2.vy = Math.min((p2.vy||0) + 0.55, 15);
    p2.x  = (p2.x||290) + (p2.vx||0);
    p2.y  = (p2.y||395) + p2.vy;
    if (p2.x < 0) p2.x=0;
    if (p2.x+24 > W) p2.x=W-24;
    if (p2.y > H+60) { p2.y=395; p2.vy=0; }
    applyPlatformLanding(p2);
    if ((p2.shootCD||0)>0) p2.shootCD--;
    if ((p2.invincible||0)>0) p2.invincible--;
    if (Math.abs(p2.vx)>0.5&&p2.onGround) {
      p2.walkTimer=(p2.walkTimer||0)+1;
      if(p2.walkTimer>8){p2.walkTimer=0;p2.walkFrame^=1;}
    } else p2.walkFrame=0;
  },

  // Host: ایجاد P2 وقتی guest وصل شد
  spawnP2() {
    this.p2 = {
      x:330, y:395, w:24, h:36,
      vx:0, vy:0, onGround:false, facing:-1,
      lives:5, shootCD:0, invincible:0,
      dead:false, walkFrame:0, walkTimer:0,
      shirt:'#ff44aa', pants:'#001a66',
      hat:'#333333', shoes:'#001a66',
    };
  },

  // رسم P2 (هم host هم guest)
  drawRemotePlayer() {
    const remote = this.p2;
    if (!remote) return;
    if (remote.dead) return;
    if (remote.invincible>0 && Math.floor(remote.invincible/5)%2===0) return;

    // گلو برای تشخیص
    ctx.shadowColor='#ff44aa'; ctx.shadowBlur=15;
    drawRobloxChar(
      Math.round(remote.x), Math.round(remote.y),
      remote.shirt||'#ff44aa', '#001a66', '#ffcc99', '#333333',
      remote.facing||1, remote.walkFrame||0, 1, false
    );
    ctx.shadowBlur=0;

    // اسم بالای سر
    ctx.fillStyle='#ff44aa'; ctx.font='bold 10px Arial Black';
    ctx.textAlign='center';
    ctx.fillText('P2', remote.x+12, remote.y-6);
    ctx.textAlign='left';

    // HP
    for(let i=0;i<Math.max(0,remote.lives||0);i++){
      ctx.fillStyle='#ff44aa';
      ctx.font='11px Arial';
      ctx.textAlign='right';
      ctx.fillText('♥', W-10-i*16, 56);
    }
    ctx.textAlign='left';
  },

  cleanup() {
    if (this.channel) { sb.removeChannel(this.channel); this.channel=null; }
    this.active=false; this.isHost=false; this.roomCode=null;
    this.p2=null; this.syncTimer=0;
  }
};

// ── Check ?room=CODE در URL ──
(async function checkRoom() {
  const params   = new URLSearchParams(location.search);
  const roomCode = params.get('room');
  if (!roomCode) return;
  // کمی صبر کن تا auth لود بشه
  setTimeout(async () => {
    await MP.init(roomCode);
    if (MP.active && MP.isHost) MP.spawnP2();
    // شروع بازی
    if (state === 'title') startGame();
  }, 1500);
})();

loadGameConfig().then(() => {
  initPlatform(); // PZUI.inject با config درست
  loop();
});
</script>
